name: Deploy

# BR-11: the system is deployed through infrastructure as code. Runs after CI
# passes on main, or by hand. The job runs in the "dev" GitHub environment,
# which is the only thing the AWS deploy role trusts (DeployAccessStack), so
# required reviewers set on that environment gate every deployment.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OpenID Connect token AWS trades for credentials

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  deploy:
    name: Deploy to dev
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI passed, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./spec
          pip install -r infra/requirements-dev.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy
        working-directory: infra
        run: npx --yes aws-cdk@2 deploy --all --require-approval never
