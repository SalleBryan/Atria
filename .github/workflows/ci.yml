name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: the older answer is of no
# use once the branch has moved on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./spec
          pip install -e "./backend[dev]"

      - name: Lint
        run: |
          ruff check spec backend
          ruff format --check spec backend

      - name: Types
        working-directory: backend
        run: mypy

      - name: Tests
        working-directory: backend
        run: pytest --cov-fail-under=85

  generated:
    name: Generated clients are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install the spec
        run: pip install -e ./spec

      # The web client holds a generated copy of the permission matrix and the
      # lifecycles. If the spec moved and the copy did not, the browser would
      # be working from stale rules.
      - name: Check
        run: python spec/generate.py --check

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./spec
          pip install -r infra/requirements-dev.txt

      - name: Lint
        working-directory: infra
        run: |
          ruff check .
          ruff format --check .

      - name: Types
        working-directory: infra
        run: mypy .

      # Builds the Lambda assets and asserts the synthesised templates, so a
      # broken stack fails here rather than during a deployment.
      - name: Tests
        working-directory: infra
        run: pytest

      - name: Synthesise
        working-directory: infra
        run: npx --yes aws-cdk@2 synth --quiet
