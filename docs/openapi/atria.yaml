openapi: 3.1.0

info:
  title: Atria API
  version: 0.1.0
  description: |
    Atria Rev B. Healthcare appointment booking for Cameroon.

    This document is the contract between the services and the two clients. It
    grows one milestone at a time: an operation appears here before it is
    implemented, and the routes still to come are listed in routes.md with the
    permission each one needs.

    Authorisation. Every operation needs a Cognito access token. The authoriser
    verifies it and resolves the caller; whether that caller may act on a
    particular record is decided in the service, against the permission matrix
    in spec/atria_spec/roles.py. A refusal is 403 with no detail about the
    record, and a record outside the caller's scope is 404 rather than 403, so
    a refusal cannot be used to discover that a record exists.

    Scopes. own, clinic, tenant. They bound what a permission reaches, and are
    reported by GET /me so a client can hide what an account cannot do.

servers:
  - url: https://api.dev.atria.example/dev
    description: Development. Synthetic data only.

security:
  - cognito: []

tags:
  - name: Identity and accounts
    description: Who the caller is, profile completion, phone verification, staff accounts.

paths:
  /me:
    get:
      tags: [Identity and accounts]
      operationId: getMe
      summary: The signed-in caller and what this account may do
      description: |
        Returns the resolved caller together with the permissions the account's
        roles carry and the screen each role lands on. Roles are fixed when the
        account is created and cannot change during a session, so this is
        stable for the life of the token.

        Implements FR-ACC-13.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                patient:
                  summary: A patient
                  value:
                    personId: p-01J9Z2
                    tenantId: t-cm-001
                    roles: [PATIENT]
                    patientProfileId: pp-01J9Z3
                    staffId: null
                    clinicId: null
                    phoneVerified: true
                    languages: [fr, en]
                    permissions:
                      appointment.read: own
                      appointment.create: own
                      care_context.read: own
                    landing: [Upcoming visits]
                receptionist:
                  summary: A receptionist at one clinic
                  value:
                    personId: p-01J9Z7
                    tenantId: t-cm-001
                    roles: [RECEPTIONIST]
                    patientProfileId: null
                    staffId: s-01J9Z8
                    clinicId: c-douala-01
                    phoneVerified: true
                    languages: [fr]
                    permissions:
                      appointment.read: clinic
                      appointment.check_in: clinic
                    landing: [Today at this clinic]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/staff:
    post:
      tags: [Identity and accounts]
      operationId: createStaffAccount
      summary: Create a staff account with its roles
      description: |
        Only a tenant administrator reaches this (permission staff.create). No
        staff account can carry the patient role: self-registration exists for
        patients only. The fields required depend on the roles requested and
        are read from spec/atria_spec/roles.py, not restated here; a clinician
        needs specialty, registrationYear, ordreNumber and languages on top of
        what every role needs.

        Creates the Cognito pool account first, then the person, the staff
        membership and any clinician profile in one transaction. If the second
        step fails the pool account is removed again, so a failed call never
        leaves a half made account.

        Implements FR-ACC-03, FR-ACC-04.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffAccount"
            examples:
              receptionist:
                summary: A receptionist
                value:
                  givenName: Amina
                  familyName: Ngo
                  phoneE164: "+237600000001"
                  clinicId: c-douala-01
                  roles: [RECEPTIONIST]
              clinician:
                summary: A clinician
                value:
                  givenName: Paul
                  familyName: Etoa
                  phoneE164: "+237600000002"
                  clinicId: c-douala-01
                  roles: [CLINICIAN]
                  specialty: Paediatrics
                  registrationYear: 2012
                  ordreNumber: CM-ONMC-12345
                  languages: [fr, en]
      responses:
        "201":
          description: The account, with the sign-in name and a one-time temporary password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccount"
        "400":
          description: A required field for the requested roles is missing, or a value is malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: invalid_request
                message: required fields are missing
                detail: { missing: [clinicId], roles: [RECEPTIONIST] }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/staff/{id}/roles:
    patch:
      tags: [Identity and accounts]
      operationId: changeStaffRoles
      summary: Change the roles on an existing account
      description: |
        Permission staff.update_roles, scoped to the account's own clinic for
        a clinic scoped caller. Roles travel in the access token, so the
        change applies at the account's next sign-in and not before
        (ADR 0015). No staff account can be changed to hold the patient role.

        Implements FR-ACC-18.
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles:
                  type: array
                  items: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: The account with its new roles, and when they take effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccount"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/staff/{id}/suspend:
    post:
      tags: [Identity and accounts]
      operationId: suspendStaffAccount
      summary: Suspend an account and revoke its sessions
      description: |
        Permission staff.suspend. Sets the membership to SUSPENDED and calls
        Cognito's global sign out for the account, so a console left open
        elsewhere stops working immediately rather than when its token
        expires.
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: The account, suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /clinicians:
    get:
      tags: [Directory]
      operationId: listClinicians
      summary: The clinicians a patient can book
      description: |
        Readable by any signed-in account of the tenant. Ordered by the year on
        the Order's roll, most senior first, and carrying a seniority band. No
        response here contains a score or rating of any kind: a patient chooses
        on specialty, qualifications and languages (ADR 0011).

        Only bookable clinicians are listed. A suspended account leaves the
        listing, so the directory cannot offer somebody the booking service
        would then refuse.

        Implements FR-DIR-01.
      parameters:
        - name: specialty
          in: query
          schema: { type: string }
          description: Exact match, ignoring case.
        - name: clinicId
          in: query
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
          description: Matches part of the given or family name, ignoring case.
      responses:
        "200":
          description: The tenant's bookable clinicians, most senior first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [clinicians, count]
                properties:
                  count: { type: integer }
                  clinicians:
                    type: array
                    items: { $ref: "#/components/schemas/ListedClinician" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clinics:
    get:
      tags: [Directory]
      operationId: listClinics
      summary: The tenant's clinics
      description: |
        Readable by any signed-in account of the tenant, ordered by name. What
        a patient needs to choose a clinic and find their way there; nothing
        internal to the clinic is listed.

        Implements FR-DIR-01.
      responses:
        "200":
          description: The tenant's clinics, by name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [clinics, count]
                properties:
                  count: { type: integer }
                  clinics:
                    type: array
                    items: { $ref: "#/components/schemas/ListedClinic" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /appointment-types:
    get:
      tags: [Directory]
      operationId: listAppointmentTypes
      summary: What the caller can book, and for how long
      description: |
        The tenant's active appointment types, by name. A patient is shown
        only the types a patient may book: a procedure is sized and placed by
        staff (ADR 0005). Lengths are in grid units, and the grid comes with
        them, so a client can say how long a visit is and ask for free starts.

        Implements FR-BKG-01.
      responses:
        "200":
          description: The types the caller may book, by name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [gridUnitMinutes, appointmentTypes, count]
                properties:
                  gridUnitMinutes: { type: integer, example: 10 }
                  count: { type: integer }
                  appointmentTypes:
                    type: array
                    items: { $ref: "#/components/schemas/ListedAppointmentType" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clinicians/{id}/slots:
    get:
      tags: [Directory]
      operationId: listFreeStarts
      summary: The free start times for one clinician, date and appointment type
      description: |
        A start is offered when every grid unit the appointment occupies, the
        type's buffer included, is inside the clinic's opening hours for that
        weekday, not already locked, not blocked by an availability exception,
        and at least the type's minimum notice from now.

        Opening hours are local to the clinic, in the region pack's timezone,
        while every instant returned is UTC. A clinic with no opening hours
        recorded for that weekday is closed and returns no slots rather than
        being given a default.

        The locks read here are the same items a booking writes, so a start
        offered by this route and taken by somebody else in between is refused
        at booking with a 409 rather than double booked.

        Implements FR-DIR-02.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The clinician's staff membership id.
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
          description: The calendar date to look at, as YYYY-MM-DD.
        - name: typeId
          in: query
          required: true
          schema: { type: string }
          description: Required, because the duration and the notice come from the type.
      responses:
        "200":
          description: The starts on offer, in time order. An empty list means none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeStarts"
        "400":
          description: The date is malformed, or typeId was not given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: That clinician is not currently taking appointments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /clinicians/{id}/calendar:
    get:
      tags: [Schedule]
      operationId: getClinicianCalendar
      summary: One clinician's appointments over a range of dates
      description: |
        Permission appointment.read. A clinician reads their own calendar; a
        receptionist or clinic manager reads any clinician's in their clinic;
        a tenant administrator any in the tenant. A patient is refused.

        Dates are the clinic's own dates in the region pack's timezone, and
        both ends are included. With no range the calendar opens on the coming
        week; the widest range is 31 days. A suspended clinician's calendar is
        still readable, because the appointments already made still need to be
        seen and moved.

        Every state is returned, cancelled ones included, each with its state.

        Implements FR-STF-01.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The clinician's staff membership id.
        - name: from
          in: query
          schema: { type: string, format: date }
          description: First date, YYYY-MM-DD. Defaults to today in the clinic.
        - name: to
          in: query
          schema: { type: string, format: date }
          description: Last date, included. Defaults to six days after from.
      responses:
        "200":
          description: The clinician's appointments in that range, earliest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [clinicianProfileId, from, to, timezone, count, appointments]
                properties:
                  clinicianProfileId: { type: string }
                  clinicId: { type: string }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  timezone:
                    type: string
                    description: The zone the dates were read in, for example Africa/Douala.
                  count: { type: integer }
                  appointments:
                    type: array
                    items: { $ref: "#/components/schemas/Appointment" }
        "400":
          description: A date is malformed, the range is backwards, or it is wider than 31 days.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /clinics/{id}/day:
    get:
      tags: [Schedule]
      operationId: getClinicDay
      summary: Every appointment in one clinic on one date
      description: |
        Permission appointment.read at clinic scope: the front desk's list. A
        clinician's scope is their own appointments, so a clinician is refused
        here and reads their own calendar instead.

        An appointment is on the list for its clinic's local date. In Douala an
        appointment at 00:30 is on that date's list, although its UTC instant
        falls on the day before.

        Implements FR-STF-01.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The clinic id, scoped to the caller's tenant.
        - name: date
          in: query
          schema: { type: string, format: date }
          description: The date, YYYY-MM-DD. Defaults to today in the clinic.
      responses:
        "200":
          description: That date's appointments across every clinician, earliest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [clinicId, date, timezone, count, appointments]
                properties:
                  clinicId: { type: string }
                  date: { type: string, format: date }
                  timezone: { type: string }
                  count: { type: integer }
                  appointments:
                    type: array
                    items: { $ref: "#/components/schemas/Appointment" }
        "400":
          description: The date is malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /appointments:
    post:
      tags: [Booking]
      operationId: bookAppointment
      summary: Book an appointment on the specialist line
      description: |
        Permission appointment.create. A patient books for themselves, and
        staff book for a patient of their own clinic; where the caller is
        booking for their own patient profile every staff scope is dropped and
        only the patient row applies, so staff tooling cannot be turned on
        one's own record (guard SELF_SUBJECT_DROPS_STAFF_SCOPE).

        The appointment holds its time by locking one item per grid unit it
        covers, including the appointment type's buffer, all in one transaction
        with the appointment and its first event. If any unit is already held
        the whole request fails with 409 and nothing is written, so two
        patients asking for one minute produce one booking.

        clinicId is not accepted: the clinic comes from the chosen clinician's
        membership, because it decides which staff scope reaches the record.
        endAt, state and version are derived and are refused if supplied
        (guard SERVER_ASSIGNED_ORDER).

        Send an Idempotency-Key to make a retry safe. A repeat with the same
        key within 24 hours returns the original appointment and carries
        Idempotency-Replayed: true, rather than the 409 the slot locks would
        otherwise produce, which would tell a patient their booking failed when
        it had in fact succeeded. Reusing one key for a different request body
        is refused.

        Implements FR-BKG-01, FR-BKG-02, FR-BKG-04, FR-BKG-05, FR-BKG-07.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 200
          description: |
            A value the client generates per booking attempt and reuses on
            every retry of that attempt. Sending it empty is refused rather
            than treated as absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookAppointment"
            examples:
              patient:
                summary: A patient booking their own specialist appointment
                value:
                  appointmentTypeId: at-spec-first
                  clinicianProfileId: s-clin-1
                  startAt: "2026-03-04T08:00:00Z"
              reception:
                summary: The front desk booking for a patient by phone
                value:
                  patientProfileId: pp-1
                  appointmentTypeId: at-spec-first
                  clinicianProfileId: s-clin-1
                  startAt: "2026-03-04T08:00:00Z"
                  channel: PHONE
      responses:
        "201":
          description: |
            The appointment, with the reference the patient quotes. A replay of
            an earlier request returns the same body and the same status.
          headers:
            Idempotency-Replayed:
              description: Present and true when this is the original answer to a repeated request.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: |
            A field is missing or malformed, the start is off the grid unit
            boundary, the start falls outside the type's notice or booking
            window, a derived field was supplied, or the Idempotency-Key is
            not between 8 and 200 characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: invalid_request
                message: startAt must fall on a grid unit boundary
                detail: { gridUnitMinutes: 10 }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            No such clinician, patient or appointment type within the caller's
            tenant. A record out of the caller's scope is reported the same
            way, so a refusal cannot be used to discover that it exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            A grid unit the appointment needs is already held, the clinician is
            not currently taking appointments, an earlier request with the same
            Idempotency-Key is still running, or that key was already used for a
            different request. Nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: conflict
                message: that time is no longer free
                detail:
                  clinicianProfileId: s-clin-1
                  startAt: "2026-03-04T08:00:00Z"
                  units: 4

  /patients/me/appointments:
    get:
      tags: [Booking]
      operationId: listMyAppointments
      summary: A patient's own appointments, upcoming or past
      description: |
        Permission appointment.read at own scope. Ordered by start time,
        earliest first. A patient's own past is shown five years back by
        default; records are retained ten years, so the horizon is what is
        shown and never what is kept (ADR 0008, subject to OI-12).

        Queue tickets belong in this answer too and arrive with the session
        queue: a ticket holds an arrival window rather than a start.

        The four range views, day, week, month and year, are a later concern.

        Implements FR-VIS-01.
      parameters:
        - name: when
          in: query
          schema:
            type: string
            enum: [upcoming, past, all]
            default: all
      responses:
        "200":
          description: The caller's own appointments in that window.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [when, from, to, count, appointments]
                properties:
                  when: { type: string, enum: [upcoming, past, all] }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  count: { type: integer }
                  appointments:
                    type: array
                    items: { $ref: "#/components/schemas/Appointment" }
        "400":
          description: The account holds no patient profile, or `when` is unknown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /appointments/{id}:
    get:
      tags: [Booking]
      operationId: getAppointment
      summary: One appointment within the caller's scope
      description: |
        Permission appointment.read. A patient sees their own, a clinician
        their own, a receptionist or clinic manager any in their clinic, an
        administrator any in the tenant. Where the caller is the patient on the
        record, staff scope is dropped and only the patient row applies (guard
        SELF_SUBJECT_DROPS_STAFF_SCOPE).

        Implements FR-VIS-02.
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: The appointment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Booking]
      operationId: cancelAppointment
      summary: Cancel an appointment and give its time back
      description: |
        Permission appointment.cancel. The update is conditional on the state
        the caller read, so a second cancellation is a 409 rather than a second
        closure, and every slot lock the appointment held is released in the
        same transaction so the time is genuinely free again.

        The record is not deleted. It moves to PATIENT_CANCELLED or
        CLINIC_CANCELLED and is retained (FR-VIS-08); DELETE refers to the
        time, not the history.

        Staff must say who cancelled, because the two land in different states
        and owe the patient different things. A patient always cancels as the
        patient and cannot declare a clinic cancellation.

        The response carries the entitlement band. Nothing settles: no money
        moves until a payment provider arrives (ADR 0007), and the fee ledger
        that aggregates these is later work.

        The reminder teardown and the cancellation email in FR-VIS-04 are not
        implemented yet and arrive with the reminder and message work.

        Implements FR-VIS-03.
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cancelledBy:
                  type: string
                  enum: [PATIENT, CLINIC]
                  description: Required when staff cancel. Ignored when the patient does.
                reason:
                  type: string
                  description: Recorded on the event. Mandatory for staff from Phase 2.
      responses:
        "200":
          description: The cancelled appointment, with the outcome and entitlement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelledAppointment" }
        "400":
          description: Staff did not say who cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            It is no longer in a state that can be cancelled, which is what a
            second cancellation gets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  parameters:
    AppointmentId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: The appointment id, scoped to the caller's tenant.

    StaffId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: The staff membership id, scoped to the caller's tenant.

  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Cognito access token from the patient, staff or admin app client. The
        token carries the tenant, the person and the roles the account was
        created with.

  schemas:
    Role:
      type: string
      enum: [PATIENT, RECEPTIONIST, CLINICIAN, CLINIC_MANAGER, TENANT_ADMIN]
      description: Generated from spec/atria_spec/roles.py.

    Scope:
      type: string
      enum: [own, clinic, tenant]
      description: How far a granted permission reaches. Refused permissions are absent.

    Me:
      type: object
      additionalProperties: false
      required:
        - personId
        - tenantId
        - roles
        - phoneVerified
        - languages
        - permissions
        - landing
      properties:
        personId:
          type: string
          description: The person behind the account. One human being.
        givenName:
          type: [string, "null"]
          description: From the person record. Null for an account with none yet.
        familyName:
          type: [string, "null"]
          description: From the person record. Null for an account with none yet.
        email:
          type: [string, "null"]
          description: The caller's own email, from the person record.
        phoneE164:
          type: [string, "null"]
          description: The caller's own mobile, from the person record.
        tenantId:
          type: string
          description: The institution. Every record the caller can reach belongs to it.
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        patientProfileId:
          type: [string, "null"]
          description: Present when this person holds a patient profile.
        staffId:
          type: [string, "null"]
          description: Present when the account is a staff membership.
        clinicId:
          type: [string, "null"]
          description: The clinic a staff membership belongs to. Bounds clinic scope.
        phoneVerified:
          type: boolean
          description: Set only by the one-time code, whatever the identity provider returned.
        languages:
          type: array
          items: { type: string }
          description: Language tags from the region pack, for example fr and en.
        permissions:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Scope" }
          description: |
            Permission to scope, widest scope winning where an account holds
            more than one role. A permission the account cannot use is absent
            rather than present with a none scope.
        landing:
          type: array
          items: { type: string }
          description: The screen each role lands on after signing in.

    CreateStaffAccount:
      type: object
      additionalProperties: false
      required: [givenName, familyName, phoneE164, roles]
      description: |
        Every field the requested roles require must be present; which fields
        those are depends on the roles, and is read from
        spec/atria_spec/roles.py REQUIRED_ON_CREATE.
      properties:
        givenName: { type: string }
        familyName: { type: string }
        phoneE164:
          type: string
          description: E.164, for example +237600000001.
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
          description: PATIENT is refused here; a staff account never carries it.
        clinicId:
          type: string
          description: Required for a role scoped to a clinic (receptionist, clinician, clinic manager).
        email:
          type: string
          description: Required for a tenant administrator; the sign-in name when there is no clinic.
        employeeNumber: { type: string }
        specialty:
          type: string
          description: Required for a clinician.
        registrationYear:
          type: integer
          description: Required for a clinician. Year entered on the Order's roll.
        ordreNumber:
          type: string
          description: Required for a clinician.
        languages:
          type: array
          items: { type: string }
          description: Required for a clinician.
        qualifications:
          type: array
          items: { type: string }

    StaffAccount:
      type: object
      additionalProperties: false
      required: [staffId, personId, tenantId, roles, status]
      properties:
        staffId: { type: string }
        personId: { type: string }
        tenantId: { type: string }
        clinicId: { type: [string, "null"] }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        status:
          type: string
          enum: [INVITED, ACTIVE, SUSPENDED, ENDED]
        givenName: { type: [string, "null"] }
        familyName: { type: [string, "null"] }
        phoneE164: { type: [string, "null"] }
        email: { type: [string, "null"] }
        employeeNumber: { type: [string, "null"] }
        signInName:
          type: string
          description: Present only on the create response. What the account signs in with.
        temporaryPassword:
          type: string
          description: |
            Present only on the create response, and only there: it is
            returned once for the administrator to pass on out of band, never
            stored and never logged.
        note:
          type: string
          description: A short note on what the caller should know, for example when a role change takes effect.

    ListedClinician:
      type: object
      additionalProperties: false
      required: [clinicianProfileId, familyName, seniorityBand]
      description: |
        What a directory listing may carry. Deliberately no score, no rating
        and no aggregate of feedback, at any scope (ADR 0011).
      properties:
        clinicianProfileId: { type: string }
        clinicId: { type: [string, "null"] }
        givenName: { type: [string, "null"] }
        familyName: { type: [string, "null"] }
        specialty: { type: [string, "null"] }
        qualifications:
          type: array
          items: { type: string }
        registrationYear:
          type: [integer, "null"]
          description: The year entered on the Order's roll, which is what the ordering uses.
        seniorityBand:
          type: string
          enum: [SENIOR, EXPERIENCED, ESTABLISHED, RECENT]
          description: Derived from the registration year at account creation.
        languages:
          type: array
          items: { type: string }

    ListedClinic:
      type: object
      additionalProperties: false
      required: [clinicId, name]
      properties:
        clinicId: { type: string }
        name: { type: string }
        address: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        openingHours:
          type: [object, "null"]
          description: Local opening and closing times by weekday, 0 for Monday.
          additionalProperties:
            type: object
            properties:
              start: { type: string, example: "08:00" }
              end: { type: string, example: "17:00" }

    ListedAppointmentType:
      type: object
      additionalProperties: false
      required: [appointmentTypeId, name, serviceLine, bookableBy]
      properties:
        appointmentTypeId: { type: string }
        code: { type: [string, "null"] }
        name: { type: string }
        serviceLine:
          type: string
          enum: [GENERAL, SPECIALIST, PROCEDURE]
        durationUnits:
          type: [integer, "null"]
          description: In grid units. Null for a queued general consultation.
        bufferUnits: { type: [integer, "null"] }
        bookableBy:
          type: string
          enum: [PATIENT, STAFF, BOTH]
        minNoticeMinutes: { type: [integer, "null"] }
        maxAdvanceDays: { type: [integer, "null"] }
        cancellationWindowMinutes:
          type: [integer, "null"]
          description: Cancelling at least this long before the start is in window (D-07).

    FreeStarts:
      type: object
      additionalProperties: false
      required: [clinicianProfileId, date, appointmentTypeId, slots]
      properties:
        clinicianProfileId: { type: string }
        clinicId:
          type: string
          description: From the clinician's membership.
        date: { type: string, format: date }
        appointmentTypeId: { type: string }
        gridUnitMinutes:
          type: integer
          description: The tenant's calendar resolution, so a client can render the grid.
        durationUnits:
          type: integer
          description: The type's duration in grid units, buffer excluded.
        slots:
          type: array
          description: In time order. Empty when the clinic is closed or nothing is free.
          items:
            type: object
            additionalProperties: false
            required: [startAt, endAt]
            properties:
              startAt: { type: string, format: date-time }
              endAt:
                type: string
                format: date-time
                description: The duration end, which is what the patient is told, not the buffer.

    BookAppointment:
      type: object
      additionalProperties: false
      required: [appointmentTypeId, clinicianProfileId, startAt]
      description: |
        clinicId is deliberately absent: it comes from the clinician's
        membership. endAt, state, version and the other derived fields are
        refused if supplied rather than being ignored.
      properties:
        patientProfileId:
          type: string
          description: |
            Who the appointment is for. Required when staff book; ignored when
            a patient books, because a patient books only for themselves.
        appointmentTypeId:
          type: string
          description: Carries the duration and buffer in grid units, and the booking window.
        clinicianProfileId:
          type: string
          description: The staff membership of the clinician being booked. Decides the clinic.
        startAt:
          type: string
          format: date-time
          description: |
            An ISO 8601 instant carrying a UTC offset, on a grid unit boundary.
            A value without an offset is refused rather than read as UTC.
        channel:
          type: string
          enum: [ONLINE, WALK_IN, PHONE, REFERRAL]
          default: ONLINE
          description: How the booking reached the clinic. Independent of the type (D-12).
        referralId:
          type: string
          description: Where a specialist appointment came from, where there is a referral.
        careContextId:
          type: string
          description: What the patient chose to send ahead of this one visit.
        reason:
          type: string
          description: Recorded on the appointment's first event.

    Appointment:
      type: object
      additionalProperties: false
      required: [appointmentId, reference, tenantId, clinicId, patientProfileId, startAt, endAt, state]
      properties:
        appointmentId: { type: string }
        reference:
          type: string
          description: What the patient quotes at the desk, for example APT-0123456789.
        tenantId: { type: string }
        clinicId:
          type: string
          description: From the clinician's membership, not from the request.
        patientProfileId: { type: string }
        appointmentTypeId: { type: string }
        clinicianProfileId:
          type: [string, "null"]
          description: Set on the specialist line. Null on the general line, which uses a session.
        sessionId:
          type: [string, "null"]
          description: |
            Set on the general line, and null here, because an appointment
            holds either a clinician and a time or a session, never both.
        startAt: { type: string, format: date-time }
        endAt:
          type: string
          format: date-time
          description: |
            From the type's durationUnits. The type's buffer is locked after
            this, so the next booking cannot start inside the turnaround, but
            it is not part of the appointment the patient is told about.
        state:
          type: string
          enum:
            [REQUESTED, DECLINED, BOOKED, CONFIRMED, RESCHEDULED, DISRUPTED, ARRIVED,
             IN_CONSULTATION, COMPLETED, AWAITING_FEEDBACK, CLINIC_CANCELLED,
             PATIENT_CANCELLED, NO_SHOW]
          description: BOOKED on creation. Confirmation is the patient's own act.
        channel:
          type: string
          enum: [ONLINE, WALK_IN, PHONE, REFERRAL]
        bookedByPersonId: { type: string }
        bookedByRole:
          type: [string, "null"]
          description: The staff role used. Null where the patient booked for themselves.
        referralId: { type: [string, "null"] }
        careContextId: { type: [string, "null"] }
        version:
          type: integer
          description: Optimistic concurrency for offline staff writes.
        createdAt: { type: string, format: date-time }

    CancelledAppointment:
      allOf:
        - $ref: "#/components/schemas/Appointment"
        - type: object
          required: [outcome, entitlement]
          properties:
            outcome:
              type: string
              enum: [CANCELLED_IN_WINDOW, CANCELLED_LATE, CLINIC_CANCELLED]
              description: |
                Which side cancelled, and whether a patient cancellation fell
                inside the type's notice window.
            entitlement:
              type: string
              enum: [NONE, PARTIAL, FULL]
              description: |
                FULL inside the window or whenever the clinic cancelled,
                PARTIAL for a late patient cancellation. A record, not a
                payment.
            note: { type: string }

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine readable reason, for example conflict or forbidden.
        message:
          type: string
          description: One sentence, safe to show. Never names a record the caller cannot see.
        detail:
          type: object
          additionalProperties: true
          description: Present where it helps the caller act, for example the allowed states.
        requestId:
          type: string
          description: The invocation, for tracing a report from a clinic.

  responses:
    Invalid:
      description: The request is malformed, or fails a validation rule.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: invalid_request
            message: at least one role is required

    Unauthenticated:
      description: No usable token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: unauthenticated, message: the request carries no resolved caller }

    Forbidden:
      description: |
        The permission matrix or a guard rule refuses this action. The body
        names the permission and nothing about the record.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: forbidden
            message: that action is not permitted for this account
            detail: { permission: appointment.reschedule }

    NotFound:
      description: |
        No such record within the caller's scope. Returned for a record that
        exists but is out of scope as well, so a refusal cannot be used to
        discover it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: not_found, message: no such appointment }

    Conflict:
      description: |
        The state no longer allows the action, or a slot unit is taken. The
        detail carries the states the lifecycle does allow.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: conflict
            message: a appointment in PATIENT_CANCELLED cannot move to PATIENT_CANCELLED
            detail:
              from: PATIENT_CANCELLED
              requested: PATIENT_CANCELLED
              allowed: []
