openapi: 3.1.0

info:
  title: Atria API
  version: 0.1.0
  description: |
    Atria Rev B. Healthcare appointment booking for Cameroon.

    This document is the contract between the services and the two clients. It
    grows one milestone at a time: an operation appears here before it is
    implemented, and the routes still to come are listed in routes.md with the
    permission each one needs.

    Authorisation. Every operation needs a Cognito access token. The authoriser
    verifies it and resolves the caller; whether that caller may act on a
    particular record is decided in the service, against the permission matrix
    in spec/atria_spec/roles.py. A refusal is 403 with no detail about the
    record, and a record outside the caller's scope is 404 rather than 403, so
    a refusal cannot be used to discover that a record exists.

    Scopes. own, clinic, tenant. They bound what a permission reaches, and are
    reported by GET /me so a client can hide what an account cannot do.

servers:
  - url: https://api.dev.atria.example/dev
    description: Development. Synthetic data only.

security:
  - cognito: []

tags:
  - name: Identity and accounts
    description: Who the caller is, profile completion, phone verification, staff accounts.
  - name: Settings
    description: The tenant administrator's settings, units, appointment types and fee bands.
  - name: Audit
    description: The audit trail of staff access to patient data and privileged changes.
  - name: Staff console
    description: The patient register, the roster and priority allowances.
  - name: Queue and requests
    description: Sessions and queue tickets on the general line, and procedure requests.
  - name: Reports and messages
    description: The weekly report, the fee ledger's totals, the message log and delivery figures.

paths:
  /me:
    get:
      tags: [Identity and accounts]
      operationId: getMe
      summary: The signed-in caller and what this account may do
      description: |
        Returns the resolved caller together with the permissions the account's
        roles carry and the screen each role lands on. Roles are fixed when the
        account is created and cannot change during a session, so this is
        stable for the life of the token.

        Implements FR-ACC-13.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                patient:
                  summary: A patient
                  value:
                    personId: p-01J9Z2
                    tenantId: t-cm-001
                    roles: [PATIENT]
                    patientProfileId: pp-01J9Z3
                    staffId: null
                    clinicId: null
                    phoneVerified: true
                    languages: [fr, en]
                    permissions:
                      appointment.read: own
                      appointment.create: own
                      care_context.read: own
                    landing: [Upcoming visits]
                receptionist:
                  summary: A receptionist at one clinic
                  value:
                    personId: p-01J9Z7
                    tenantId: t-cm-001
                    roles: [RECEPTIONIST]
                    patientProfileId: null
                    staffId: s-01J9Z8
                    clinicId: c-douala-01
                    phoneVerified: true
                    languages: [fr]
                    permissions:
                      appointment.read: clinic
                      appointment.check_in: clinic
                    landing: [Today at this clinic]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/staff:
    get:
      tags: [Identity and accounts]
      operationId: listStaffAccounts
      summary: The tenant's staff accounts, a page at a time
      description: |
        Only a tenant administrator reaches this (permission staff.create, the
        same as creating an account). Accounts are listed by family name, and a
        suspended account stays on the list, because an administrator acts on
        those too. Patients never appear: they have no staff membership.

        The list is searched and filtered on the server, then returned a page
        at a time, never more than 50 accounts (NFR-PERF-04). Pass nextCursor
        back as cursor, with the same q and filters, for the page after. count
        is how many accounts match, total how many the tenant has. facets
        counts every account of the tenant by role, clinic and status, whatever
        the filters, so a client can offer the most used first.

        mustSetPassword is true while the account is INVITED: it still holds
        the temporary password it was created with. Its first authenticated
        request (GET /me) marks it ACTIVE, since no token is issued until that
        password is replaced. Nothing secret is listed.

        Supports FR-ACC-04 and FR-ACC-18 (the list an administrator changes
        roles and suspends from).
      parameters:
        - name: q
          in: query
          description: Words from a name, email, mobile number or employee number.
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: clinic
          in: query
          description: A clinic ID.
          schema: { type: string }
        - name: status
          in: query
          description: awaiting (never signed in), active, or suspended.
          schema: { type: string, enum: [awaiting, active, suspended] }
        - name: limit
          in: query
          description: Accounts per page, 25 unless given, never more than 50.
          schema: { type: integer, minimum: 1, maximum: 50 }
        - name: cursor
          in: query
          description: The nextCursor of the page before.
          schema: { type: string }
      responses:
        "200":
          description: One page of the tenant's staff accounts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [count, total, accounts, nextCursor, facets]
                properties:
                  count: { type: integer, description: Accounts matching the search and filters. }
                  total: { type: integer, description: Every staff account of the tenant. }
                  accounts:
                    type: array
                    maxItems: 50
                    items:
                      allOf:
                        - $ref: "#/components/schemas/StaffAccount"
                        - type: object
                          properties:
                            mustSetPassword: { type: boolean }
                  nextCursor: { type: [string, "null"] }
                  facets:
                    type: object
                    additionalProperties: false
                    required: [roles, clinics, status]
                    properties:
                      roles: { type: object, additionalProperties: { type: integer } }
                      clinics: { type: object, additionalProperties: { type: integer } }
                      status: { type: object, additionalProperties: { type: integer } }
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Identity and accounts]
      operationId: createStaffAccount
      summary: Create a staff account with its roles
      description: |
        Only a tenant administrator reaches this (permission staff.create). No
        staff account can carry the patient role: self-registration exists for
        patients only. The fields required depend on the roles requested and
        are read from spec/atria_spec/roles.py, not restated here; a clinician
        needs specialty, registrationYear, ordreNumber and languages on top of
        what every role needs.

        Creates the Cognito pool account first, then the person, the staff
        membership and any clinician profile in one transaction. If the second
        step fails the pool account is removed again, so a failed call never
        leaves a half made account.

        Implements FR-ACC-03, FR-ACC-04.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffAccount"
            examples:
              receptionist:
                summary: A receptionist
                value:
                  givenName: Amina
                  familyName: Ngo
                  phoneE164: "+237600000001"
                  clinicId: c-douala-01
                  roles: [RECEPTIONIST]
              clinician:
                summary: A clinician
                value:
                  givenName: Paul
                  familyName: Etoa
                  phoneE164: "+237600000002"
                  clinicId: c-douala-01
                  roles: [CLINICIAN]
                  specialty: Paediatrics
                  registrationYear: 2012
                  ordreNumber: CM-ONMC-12345
                  languages: [fr, en]
      responses:
        "201":
          description: The account, with the sign-in name and a one-time temporary password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccount"
        "400":
          description: A required field for the requested roles is missing, or a value is malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: invalid_request
                message: required fields are missing
                detail: { missing: [clinicId], roles: [RECEPTIONIST] }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/staff/{id}/roles:
    patch:
      tags: [Identity and accounts]
      operationId: changeStaffRoles
      summary: Change the roles on an existing account
      description: |
        Permission staff.update_roles, scoped to the account's own clinic for
        a clinic scoped caller. Roles travel in the access token, so the
        change applies at the account's next sign-in and not before
        (ADR 0015). No staff account can be changed to hold the patient role.

        Implements FR-ACC-18.
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles:
                  type: array
                  items: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: The account with its new roles, and when they take effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccount"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/staff/{id}/suspend:
    post:
      tags: [Identity and accounts]
      operationId: suspendStaffAccount
      summary: Suspend an account and revoke its sessions
      description: |
        Permission staff.suspend. Sets the membership to SUSPENDED and calls
        Cognito's global sign out for the account, so a console left open
        elsewhere stops working immediately rather than when its token
        expires.
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: The account, suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/staff/{id}/temporary-password:
    post:
      tags: [Identity and accounts]
      operationId: issueStaffTemporaryPassword
      summary: Give an account a new temporary password, shown once
      description: |
        Permission staff.reset_password. For an account whose first temporary
        password expired before it was used (they last 7 days), or a colleague
        who forgot theirs. The account must set its own password at its next
        sign-in, and any session it holds is ended. A suspended or deleted
        account is restored first (409).
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: The account, with the sign-in name and a one-time temporary password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/staff/{id}/clinician:
    get:
      tags: [Identity and accounts]
      operationId: getClinicianDetails
      summary: A clinician's professional details, for correcting them
      description: Permission staff.update_profile. 404 when the account is not a clinician's.
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: The details as recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicianDetails"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Identity and accounts]
      operationId: correctClinicianDetails
      summary: Correct a clinician's specialty, Order registration or languages
      description: |
        Permission staff.update_profile. Only the fields sent change; a
        specialty and a registration year cannot be cleared. A new
        registration year moves the seniority band and the directory order.
        The name, mobile and unit are not changed here.
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                specialty: { type: string, maxLength: 80 }
                registrationYear: { type: integer }
                ordreNumber: { type: [string, "null"] }
                languages: { type: array, items: { type: string } }
                qualifications: { type: array, items: { type: string } }
      responses:
        "200":
          description: The details as now recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicianDetails"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /clinicians:
    get:
      tags: [Directory]
      operationId: listClinicians
      summary: The clinicians a patient can book
      description: |
        Readable by any signed-in account of the tenant. Ordered by the year on
        the Order's roll, most senior first, and carrying a seniority band. No
        response here contains a score or rating of any kind: a patient chooses
        on specialty, qualifications and languages (ADR 0011).

        Only bookable clinicians are listed. A suspended account leaves the
        listing, so the directory cannot offer somebody the booking service
        would then refuse.

        Implements FR-DIR-01.
      parameters:
        - name: specialty
          in: query
          schema: { type: string }
          description: Exact match, ignoring case.
        - name: clinicId
          in: query
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
          description: Matches part of the given or family name, ignoring case.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The tenant's bookable clinicians, most senior first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [clinicians, count, nextCursor]
                properties:
                  count: { type: integer, description: How many the whole list holds, across every page. }
                  nextCursor: { type: [string, "null"], description: Pass back as cursor for the next page; null on the last. }
                  clinicians:
                    type: array
                    items: { $ref: "#/components/schemas/ListedClinician" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clinics:
    get:
      tags: [Directory]
      operationId: listClinics
      summary: The tenant's clinics
      description: |
        Readable by any signed-in account of the tenant, ordered by name. What
        a patient needs to choose a clinic and find their way there; nothing
        internal to the clinic is listed.

        Implements FR-DIR-01.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The tenant's clinics, by name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [clinics, count, nextCursor]
                properties:
                  count: { type: integer, description: How many the whole list holds, across every page. }
                  nextCursor: { type: [string, "null"], description: Pass back as cursor for the next page; null on the last. }
                  clinics:
                    type: array
                    items: { $ref: "#/components/schemas/ListedClinic" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /appointment-types:
    get:
      tags: [Directory]
      operationId: listAppointmentTypes
      summary: What the caller can book, and for how long
      description: |
        The tenant's active appointment types, by name. A patient is shown
        only the types a patient may book: a procedure is sized and placed by
        staff (ADR 0005). Lengths are in grid units, and the grid comes with
        them, so a client can say how long a visit is and ask for free starts.

        Implements FR-BKG-01.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The types the caller may book, by name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [gridUnitMinutes, appointmentTypes, count, nextCursor]
                properties:
                  gridUnitMinutes: { type: integer, example: 10 }
                  count: { type: integer, description: How many the whole list holds, across every page. }
                  nextCursor: { type: [string, "null"], description: Pass back as cursor for the next page; null on the last. }
                  appointmentTypes:
                    type: array
                    items: { $ref: "#/components/schemas/ListedAppointmentType" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clinicians/{id}/slots:
    get:
      tags: [Directory]
      operationId: listFreeStarts
      summary: The free start times for one clinician and appointment type, for a date or a week
      description: |
        A start is offered when every grid unit the appointment occupies, the
        type's buffer included, is inside the clinic's opening hours for that
        weekday, not already locked, not blocked by an availability exception,
        and at least the type's minimum notice from now.

        Opening hours are local to the clinic, in the region pack's timezone,
        while every instant returned is UTC. A clinic with no opening hours
        recorded for that weekday is closed and returns no slots rather than
        being given a default.

        The locks read here are the same items a booking writes, so a start
        offered by this route and taken by somebody else in between is refused
        at booking with a 409 rather than double booked.

        Give date for one date, answered as slots. Give from and to instead
        for up to seven dates in one call, answered as days: each date with
        its starts. A booking screen shows a week, and one call for it rather
        than seven keeps the screen from waking seven cold functions at once
        (NFR-PERF-01).

        Implements FR-DIR-02.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The clinician's staff membership id.
        - name: date
          in: query
          schema: { type: string, format: date }
          description: The calendar date to look at, as YYYY-MM-DD. Required unless from is given.
        - name: from
          in: query
          schema: { type: string, format: date }
          description: The first of up to seven dates, in place of date.
        - name: to
          in: query
          schema: { type: string, format: date }
          description: The last of them. Defaults to from.
        - name: typeId
          in: query
          required: true
          schema: { type: string }
          description: Required, because the duration and the notice come from the type.
      responses:
        "200":
          description: The starts on offer, in time order. An empty list means none.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FreeStarts"
                  - $ref: "#/components/schemas/FreeStartsWeek"
        "400":
          description: A date is malformed, the range is backwards or longer than seven days, or typeId was not given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: That clinician is not currently taking appointments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /clinicians/{id}/calendar:
    get:
      tags: [Schedule]
      operationId: getClinicianCalendar
      summary: One clinician's appointments over a range of dates
      description: |
        Permission appointment.read. A clinician reads their own calendar; a
        receptionist or clinic manager reads any clinician's in their clinic;
        a tenant administrator any in the tenant. A patient is refused.

        Dates are the clinic's own dates in the region pack's timezone, and
        both ends are included. With no range the calendar opens on the coming
        week; the widest range is 31 days. A suspended clinician's calendar is
        still readable, because the appointments already made still need to be
        seen and moved.

        Every state is returned, cancelled ones included, each with its state.
        Each patient is named once in `patients`, by profile, because a
        calendar of identifiers is one nobody at a desk can use. Names only:
        whoever can read an appointment can already read its patient
        (patient.read has the same scope as appointment.read for every role).

        Implements FR-STF-01.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The clinician's staff membership id.
        - name: from
          in: query
          schema: { type: string, format: date }
          description: First date, YYYY-MM-DD. Defaults to today in the clinic.
        - name: to
          in: query
          schema: { type: string, format: date }
          description: Last date, included. Defaults to six days after from.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The clinician's appointments in that range, earliest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [clinicianProfileId, from, to, timezone, count, appointments, patients, nextCursor]
                properties:
                  clinicianProfileId: { type: string }
                  clinicId: { type: string }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  timezone:
                    type: string
                    description: The zone the dates were read in, for example Africa/Douala.
                  count: { type: integer, description: How many the whole list holds, across every page. }
                  nextCursor: { type: [string, "null"], description: Pass back as cursor for the next page; null on the last. }
                  appointments:
                    type: array
                    items: { $ref: "#/components/schemas/Appointment" }
                  patients: { $ref: "#/components/schemas/PatientNames" }
                  noShowDue:
                    type: array
                    items: { type: string }
                    description: Appointments on this page still scheduled 30 minutes after their end, which staff should now be asked about (FR-STF-05).
        "400":
          description: A date is malformed, the range is backwards, or it is wider than 31 days.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /clinics/{id}/day:
    get:
      tags: [Schedule]
      operationId: getClinicDay
      summary: Every appointment in one clinic on one date, or on up to a week of them
      description: |
        Permission appointment.read at clinic scope: the front desk's list. A
        clinician's scope is their own appointments, so a clinician is refused
        here and reads their own calendar instead.

        An appointment is on the list for its clinic's local date. In Douala an
        appointment at 00:30 is on that date's list, although its UTC instant
        falls on the day before. Patients are named in `patients`, as on the
        calendar.

        Give from and to in place of date for up to seven dates in one call,
        as the week view does, answered with from and to in place of date.
        One call for the week rather than seven keeps the view from waking
        seven cold functions at once (NFR-PERF-01).

        Implements FR-STF-01.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The clinic id, scoped to the caller's tenant.
        - name: date
          in: query
          schema: { type: string, format: date }
          description: The date, YYYY-MM-DD. Defaults to today in the clinic.
        - name: from
          in: query
          schema: { type: string, format: date }
          description: The first of up to seven dates, in place of date.
        - name: to
          in: query
          schema: { type: string, format: date }
          description: The last of them. Defaults to from.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: That date's appointments across every clinician, earliest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [clinicId, timezone, count, appointments, patients, nextCursor]
                properties:
                  clinicId: { type: string }
                  date: { type: string, format: date, description: Given when one date was asked for. }
                  from: { type: string, format: date, description: Given when a range was asked for. }
                  to: { type: string, format: date }
                  timezone: { type: string }
                  count: { type: integer, description: How many the whole list holds, across every page. }
                  nextCursor: { type: [string, "null"], description: Pass back as cursor for the next page; null on the last. }
                  appointments:
                    type: array
                    items: { $ref: "#/components/schemas/Appointment" }
                  patients: { $ref: "#/components/schemas/PatientNames" }
                  noShowDue:
                    type: array
                    items: { type: string }
                    description: Appointments on this page still scheduled 30 minutes after their end, which staff should now be asked about (FR-STF-05).
        "400":
          description: The date is malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /appointments:
    post:
      tags: [Booking]
      operationId: bookAppointment
      summary: Book an appointment on the specialist line
      description: |
        Permission appointment.create. A patient books for themselves, and
        staff book for a patient of their own clinic; where the caller is
        booking for their own patient profile every staff scope is dropped and
        only the patient row applies, so staff tooling cannot be turned on
        one's own record (guard SELF_SUBJECT_DROPS_STAFF_SCOPE).

        The appointment holds its time by locking one item per grid unit it
        covers, including the appointment type's buffer, all in one transaction
        with the appointment and its first event. If any unit is already held
        the whole request fails with 409 and nothing is written, so two
        patients asking for one minute produce one booking.

        clinicId is not accepted: the clinic comes from the chosen clinician's
        membership, because it decides which staff scope reaches the record.
        endAt, state and version are derived and are refused if supplied
        (guard SERVER_ASSIGNED_ORDER).

        Send an Idempotency-Key to make a retry safe. A repeat with the same
        key within 24 hours returns the original appointment and carries
        Idempotency-Replayed: true, rather than the 409 the slot locks would
        otherwise produce, which would tell a patient their booking failed when
        it had in fact succeeded. Reusing one key for a different request body
        is refused.

        Implements FR-BKG-01, FR-BKG-02, FR-BKG-04, FR-BKG-05, FR-BKG-07.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 200
          description: |
            A value the client generates per booking attempt and reuses on
            every retry of that attempt. Sending it empty is refused rather
            than treated as absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookAppointment"
            examples:
              patient:
                summary: A patient booking their own specialist appointment
                value:
                  appointmentTypeId: at-spec-first
                  clinicianProfileId: s-clin-1
                  startAt: "2026-03-04T08:00:00Z"
              reception:
                summary: The front desk booking for a patient by phone
                value:
                  patientProfileId: pp-1
                  appointmentTypeId: at-spec-first
                  clinicianProfileId: s-clin-1
                  startAt: "2026-03-04T08:00:00Z"
                  channel: PHONE
      responses:
        "201":
          description: |
            The appointment, with the reference the patient quotes. A replay of
            an earlier request returns the same body and the same status.
          headers:
            Idempotency-Replayed:
              description: Present and true when this is the original answer to a repeated request.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: |
            A field is missing or malformed, the start is off the grid unit
            boundary, the start falls outside the type's notice or booking
            window, a derived field was supplied, or the Idempotency-Key is
            not between 8 and 200 characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: invalid_request
                message: startAt must fall on a grid unit boundary
                detail: { gridUnitMinutes: 10 }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            No such clinician, patient or appointment type within the caller's
            tenant. A record out of the caller's scope is reported the same
            way, so a refusal cannot be used to discover that it exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            A grid unit the appointment needs is already held, the clinician is
            not currently taking appointments, an earlier request with the same
            Idempotency-Key is still running, or that key was already used for a
            different request. Nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: conflict
                message: that time is no longer free
                detail:
                  clinicianProfileId: s-clin-1
                  startAt: "2026-03-04T08:00:00Z"
                  units: 4

  /patients/me/appointments:
    get:
      tags: [Booking]
      operationId: listMyAppointments
      summary: A patient's own appointments, upcoming or past
      description: |
        Permission appointment.read at own scope. Ordered by start time,
        earliest first. A patient's own past is shown five years back by
        default; records are retained ten years, so the horizon is what is
        shown and never what is kept (ADR 0008, subject to OI-12).

        Queue tickets belong in this answer too and arrive with the session
        queue: a ticket holds an arrival window rather than a start.

        The four range views, day, week, month and year, are a later concern.

        Implements FR-VIS-01.
      parameters:
        - name: when
          in: query
          schema:
            type: string
            enum: [upcoming, past, all]
            default: all
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The caller's own appointments in that window.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [when, from, to, count, appointments, nextCursor]
                properties:
                  when: { type: string, enum: [upcoming, past, all] }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  count: { type: integer, description: How many the whole list holds, across every page. }
                  nextCursor: { type: [string, "null"], description: Pass back as cursor for the next page; null on the last. }
                  appointments:
                    type: array
                    items: { $ref: "#/components/schemas/Appointment" }
        "400":
          description: The account holds no patient profile, or `when` is unknown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /appointments/{id}:
    get:
      tags: [Booking]
      operationId: getAppointment
      summary: One appointment within the caller's scope
      description: |
        Permission appointment.read. A patient sees their own, a clinician
        their own, a receptionist or clinic manager any in their clinic, an
        administrator any in the tenant. Where the caller is the patient on the
        record, staff scope is dropped and only the patient row applies (guard
        SELF_SUBJECT_DROPS_STAFF_SCOPE).

        Implements FR-VIS-02.
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: The appointment, its ledger entry once closed, and what cancelling now would record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentRecord" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Booking]
      operationId: cancelAppointment
      summary: Cancel an appointment and give its time back
      description: |
        Permission appointment.cancel. The update is conditional on the state
        the caller read, so a second cancellation is a 409 rather than a second
        closure, and every slot lock the appointment held is released in the
        same transaction so the time is genuinely free again.

        The record is not deleted. It moves to PATIENT_CANCELLED or
        CLINIC_CANCELLED and is retained (FR-VIS-08); DELETE refers to the
        time, not the history.

        Staff must say who cancelled, because the two land in different states
        and owe the patient different things. A patient always cancels as the
        patient and cannot declare a clinic cancellation.

        The response carries the entitlement band. Nothing settles: no money
        moves until a payment provider arrives (ADR 0007), and the fee ledger
        that aggregates these is later work.

        The reminder teardown and the cancellation email in FR-VIS-04 are not
        implemented yet and arrive with the reminder and message work.

        Implements FR-VIS-03.
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cancelledBy:
                  type: string
                  enum: [PATIENT, CLINIC]
                  description: Required when staff cancel. Ignored when the patient does.
                reason:
                  type: string
                  description: Recorded on the event. Required when staff cancel, and never prefilled (FR-VIS-05).
      responses:
        "200":
          description: The cancelled appointment, with the outcome and entitlement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelledAppointment" }
        "400":
          description: Staff did not say who cancelled, or why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            It is no longer in a state that can be cancelled, which is what a
            second cancellation gets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /appointments/{id}/reschedule:
    post:
      tags: [Booking]
      operationId: rescheduleAppointment
      summary: Move an appointment to another time
      description: |
        Permission appointment.reschedule: a patient their own, staff within
        their scope. The same appointment moves and keeps its reference; the
        new units are locked and the old ones freed in one transaction, and
        the event records the previous time (FR-VIS-07). The state becomes
        RESCHEDULED. A patient moves the time only; staff may also move it to
        another clinician. The type's notice and booking window apply as for
        a new booking. The patient is emailed the new time and the reminder is
        set again for it.

        Staff give a reason and say whose move it is (FR-VIS-05). A clinic
        move is recorded with entitlement NONE (FR-MSR-06).
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [startAt]
              properties:
                startAt: { type: string, format: date-time }
                clinicianProfileId:
                  type: string
                  description: Staff only. Defaults to the current clinician.
                rescheduledBy:
                  type: string
                  enum: [PATIENT, CLINIC]
                  description: Required when staff move it.
                reason:
                  type: string
                  maxLength: 500
                  description: Required when staff move it; never prefilled.
      responses:
        "200":
          description: The moved appointment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400":
          description: The time is in the past, off the grid, outside the type's window, or a required field is missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The new time is taken, or the appointment is closed or changed meanwhile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /appointments/{id}/confirm:
    post:
      tags: [Booking]
      operationId: confirmAppointment
      summary: The patient confirms they will come
      description: BOOKED to CONFIRMED. Only the patient, never staff on their behalf.
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200": { $ref: "#/components/responses/MovedAppointment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongState" }

  /appointments/{id}/arrive:
    post:
      tags: [Schedule]
      operationId: recordArrival
      summary: Record that the patient has arrived
      description: |
        Permission appointment.check_in. From any scheduled state to ARRIVED,
        recorded against the staff account (FR-STF-04). Two people pressing it
        at once record one arrival; the second gets 409.
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200": { $ref: "#/components/responses/MovedAppointment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongState" }

  /appointments/{id}/ticket:
    get:
      tags: [Queue and requests]
      operationId: getTicketOutlook
      summary: A patient's own live place in a queue
      description: |
        For the patient polling their ticket. Counts and times only, never another
        patient. Allowed to whoever may read the appointment. Not a booking in a
        queue is a 404. The start time is an estimate from this session's measured
        consultation length, rounded up to five minutes, and the rules (bypass,
        urgent) can change the order, so ahead is "about".
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: The place now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointmentId: { type: string }
                  state: { type: string }
                  position: { type: integer }
                  sessionStatus: { type: string }
                  issuedTickets: { type: integer }
                  arrivalWindowStart: { type: string, format: date-time }
                  arrivalWindowEnd: { type: string, format: date-time }
                  ahead: { type: integer, description: Patients waiting or here with an earlier place. }
                  inConsultation: { type: integer }
                  consultationMinutes: { type: number }
                  expectedStartAt: { type: string, format: date-time }
                  next: { type: boolean, description: Here and nobody ahead. }
                  invite: { $ref: "#/components/schemas/EarlyCallInvite" }
        "404":
          description: The booking is not a place in a queue.

  /appointments/{id}/urgent:
    post:
      tags: [Queue and requests]
      operationId: markUrgent
      summary: The desk marks a queue place urgent, or clears the mark (ADR 0022)
      description: |
        Permission queue.mark_urgent: the receptionist at clinic scope, and no
        other role (owner decision 2026-11-13). Only a place in the general
        queue that is still waiting. An urgent place is called before any other
        who is here and costs nobody a bypass. Marking needs a reason; it is
        kept with who marked it and when, and the route is audited.
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                urgent: { type: boolean, default: true, description: false clears the mark. }
                reason: { type: string, maxLength: 200, description: Required when marking. }
      responses:
        "200":
          description: The place, with its urgent flag.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Appointment"
                  - type: object
                    properties:
                      urgent: { type: boolean }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /appointments/{id}/invite-reply:
    post:
      tags: [Queue and requests]
      operationId: replyToInvite
      summary: Answer an early-call invitation (ADR 0022 R4)
      description: |
        Permission queue.reply_invite: the patient for their own place, or the
        receptionist at clinic scope recording a reply given by phone. YES records
        the reply and an ETA (the invitation's closing time); NO records the
        refusal. Neither moves the place or checks anyone in: a YES patient
        arrives and is checked in like any arrival. Answering the same way twice
        is allowed; changing an answer, answering after the invitation closed or
        after the patient arrived is a 409.
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, enum: [YES, NO, yes, no] }
      responses:
        "200":
          description: The place, with its invitation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Appointment"
                  - type: object
                    properties:
                      invite: { $ref: "#/components/schemas/EarlyCallInvite" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /appointments/{id}/start:
    post:
      tags: [Schedule]
      operationId: startConsultation
      summary: The clinician starts the consultation
      description: |
        ARRIVED to IN_CONSULTATION. Needs appointment.check_in in scope and the
        caller to be a clinician or a unit manager: the desk records arrival,
        it does not open a consultation.
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200": { $ref: "#/components/responses/MovedAppointment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongState" }

  /appointments/{id}/complete:
    post:
      tags: [Schedule]
      operationId: completeConsultation
      summary: The clinician closes the consultation
      description: IN_CONSULTATION to COMPLETED, under the same rule as start.
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200": { $ref: "#/components/responses/MovedAppointment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongState" }

  /appointments/{id}/no-show:
    post:
      tags: [Schedule]
      operationId: recordNoShow
      summary: Record that the patient did not come
      description: |
        Permission appointment.mark_no_show. Only from a scheduled state and
        only once 30 minutes have passed since the scheduled end; the day
        list's noShowDue names the visits that qualify (FR-STF-05). The
        reminder, if any, is taken down.
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200": { $ref: "#/components/responses/MovedAppointment" }
        "400":
          description: It is too early; detail.from says when it can be recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongState" }

  /clinicians/{id}/availability:
    get:
      tags: [Schedule]
      operationId: getAvailability
      summary: A clinician's working hours and time off from today
      description: |
        Permission availability.read. usesUnitHours is true while the
        clinician has no hours of their own, and the unit's opening hours
        apply. Time off is listed once per block or leave, with the dates it
        covers.
      parameters:
        - $ref: "#/components/parameters/ClinicianId"
      responses:
        "200":
          description: Hours and time off.
          content:
            application/json:
              schema:
                type: object
                required: [clinicianProfileId, clinicId, usesUnitHours, hours, unitHours, timeOff]
                properties:
                  clinicianProfileId: { type: string }
                  clinicId: { type: string }
                  usesUnitHours: { type: boolean }
                  hours: { $ref: "#/components/schemas/WeekHours" }
                  unitHours: { $ref: "#/components/schemas/WeekHours" }
                  timeOff:
                    type: array
                    items: { $ref: "#/components/schemas/TimeOff" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinicians/{id}/hours:
    put:
      tags: [Schedule]
      operationId: setHours
      summary: Replace a clinician's working week (FR-DIR-03)
      description: |
        Permission availability.write: a clinician their own, a unit manager
        their unit's. Weekday 0 is Monday. A weekday left out or null is a day
        off. Times sit on the tenant's grid. The free search follows the new
        hours at once; visits already booked are not moved.
      parameters:
        - $ref: "#/components/parameters/ClinicianId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/Span"
      responses:
        "200":
          description: The saved week.
          content:
            application/json:
              schema:
                type: object
                properties:
                  clinicianProfileId: { type: string }
                  usesUnitHours: { type: boolean }
                  hours: { $ref: "#/components/schemas/WeekHours" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinicians/{id}/time-off:
    post:
      tags: [Schedule]
      operationId: takeTimeOff
      summary: Take time away from a clinician (FR-DIR-04, FR-DIR-05, FR-STF-10)
      description: |
        BLOCK takes free time out of booking and is refused with 409 when a
        visit is inside, naming the references (move or cancel them first).
        LEAVE is whole days, date or from and to; the visits inside become
        DISRUPTED. UNAVAILABLE is a date, whole or startTime to endTime; the
        visits inside become DISRUPTED. A disrupted patient is emailed, their
        reminder removed, and offered the next times; accepting one books the
        visit again.

        BLOCK and LEAVE need availability.write; UNAVAILABLE needs
        session.disrupt, which the front desk holds. A reason is required and
        is shown to patients in general terms. Only today onwards.
      parameters:
        - $ref: "#/components/parameters/ClinicianId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, reason]
              properties:
                kind: { type: string, enum: [BLOCK, LEAVE, UNAVAILABLE] }
                date: { type: string, format: date }
                from: { type: string, format: date }
                to: { type: string, format: date }
                startTime: { type: string, example: "09:00" }
                endTime: { type: string, example: "12:00" }
                reason: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The time off, and the visits it disrupted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TimeOff"
                  - type: object
                    properties:
                      disrupted:
                        type: array
                        items: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A block would cover booked visits; detail.references names them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /clinicians/{id}/time-off/{groupId}:
    delete:
      tags: [Schedule]
      operationId: giveBackTimeOff
      summary: Give back a block or leave
      description: |
        Permission availability.write. Every date of the block or leave is
        given back and can be booked again. Visits it disrupted stay
        DISRUPTED: each patient has already been asked to choose.
      parameters:
        - $ref: "#/components/parameters/ClinicianId"
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The dates given back.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupId: { type: string }
                  dates: { type: array, items: { type: string, format: date } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Everything the settings screens show, in one read (FR-ADM-03, FR-ADM-06, FR-ADM-09)
      description: |
        Permission clinic.manage (a tenant administrator). The tenant's
        settings with the region pack lock and its reason (FR-TEN-07), the
        pack, the units, every appointment type including retired ones, and
        the fee bands in force.
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { $ref: "#/components/schemas/TenantSettings" }
                  regionPack: { type: object }
                  clinics: { type: array, items: { type: object } }
                  appointmentTypes: { type: array, items: { $ref: "#/components/schemas/AppointmentTypeSettings" } }
                  feeBands: { type: array, items: { $ref: "#/components/schemas/FeeBand" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Settings]
      operationId: changeSettings
      summary: Change the tenant's settings and switches
      description: |
        Each field needs its permission: regionPackCode region_pack.choose;
        qualityProgrammeEnabled, ratingAffectsFee and the no-show strike
        fields feature_flag.set; the rest clinic.manage. The region pack and
        the grid unit are refused once the tenant has its first appointment
        (detail.locked). ratingAffectsFee is refused where the pack forbids
        it (FR-TEN-05). A no-show threshold of 0 is off, the default
        (FR-TEN-04). Unknown fields are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantSettings" }
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSettings" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/clinics/{id}:
    patch:
      tags: [Settings]
      operationId: changeUnit
      summary: A unit's profile, services and opening hours (FR-ADM-03)
      description: |
        Permission clinic.manage. Opening hours are weekday (0 Monday) to
        {start, end} on the grid, or null for closed. Patients see the change
        at once.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                address: { type: string, maxLength: 160 }
                phone: { type: string, example: "+237600000000" }
                description: { type: string, maxLength: 300 }
                services: { type: array, maxItems: 12, items: { type: string, maxLength: 60 } }
                openingHours: { $ref: "#/components/schemas/WeekHours" }
      responses:
        "200": { description: The unit after the change. }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/appointment-types:
    post:
      tags: [Settings]
      operationId: createAppointmentType
      summary: A new appointment type, without a release (FR-ADM-06)
      description: |
        Permission appointment_type.manage. A GENERAL type is queued and has
        no duration; a PROCEDURE is booked by STAFF and may be
        patientRequestable. feeBandId must be one of the tenant's bands;
        clinicIds, where given, limits it to those units (FR-TEN-02).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentTypeSettings" }
      responses:
        "201":
          description: The type, offered at once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentTypeSettings" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/appointment-types/{id}:
    patch:
      tags: [Settings]
      operationId: changeAppointmentType
      summary: Change or retire an appointment type
      description: |
        Permission appointment_type.manage. The service line cannot change.
        active false retires it: it leaves booking and stays on visits
        already booked.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentTypeSettings" }
      responses:
        "200": { description: The type after the change. }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/fee-bands/{id}:
    put:
      tags: [Settings]
      operationId: setFeeBand
      summary: A fee band's amount, as a new version from today (FR-ADM-06)
      description: |
        Permission fee_band.manage. The version it replaces is kept and stays
        what the ledger uses for visits before today. Amounts are in XAF,
        whole francs.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [practice, baseAmountMinor]
              properties:
                practice: { type: string, maxLength: 60 }
                baseAmountMinor: { type: integer, minimum: 0 }
                scheduleReference: { type: string, maxLength: 160 }
      responses:
        "200":
          description: The new version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeBand" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /audit:
    get:
      tags: [Audit]
      operationId: listAudit
      summary: The audit trail, newest first (FR-ADM-04, FR-ADM-05)
      description: |
        Permission audit.read: a tenant administrator reads the tenant's
        entries, a unit manager their unit's. Every staff read and change of
        patient data is an entry, and so is every other privileged change
        (FR-PRV-06). Dates are UTC days, a week back by default, 31 at most.
        An entry counts the patients it touched and never names them; the
        export does. No entry can be edited or deleted.
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditKind"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of entries, and everyone and everything in the range for the filters.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, count, nextCursor, entries, actors, actions]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  count: { type: integer }
                  nextCursor: { type: [string, "null"] }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  actors:
                    type: array
                    items:
                      type: object
                      properties:
                        personId: { type: string }
                        name: { type: string }
                        role: { type: [string, "null"] }
                  actions: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /audit/export:
    get:
      tags: [Audit]
      operationId: exportAudit
      summary: The same entries as a CSV file (FR-ADM-04)
      description: |
        Permission audit.read, the same filters as the list, at most 10,000
        rows. Each row names the patient records the action touched, the
        source address, browser and request id. The export is itself an
        entry (audit.export).
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditKind"
      responses:
        "200":
          description: A CSV file, sent as an attachment.
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/staff/{id}/priority-allowance:
    put:
      tags: [Staff console]
      operationId: setPriorityAllowance
      summary: Grant, change or withdraw a monthly priority allowance (FR-STF-13)
      description: |
        Permission priority_allowance.grant, the administrator's. The only staff
        priority there is (guard BOUNDED_PRIORITY): explicit, at most 10 a month,
        and shown with its usage on the staff list. 0 withdraws it. A suspended
        account holds none.
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quotaPerMonth]
              properties:
                quotaPerMonth: { type: integer, minimum: 0, maximum: 10 }
      responses:
        "200":
          description: The allowance as it stands this month, or null once withdrawn.
          content:
            application/json:
              schema: 
                type: object
                properties:
                  staffId: { type: string }
                  priorityAllowance:
                    type: [object, "null"]
                    properties:
                      quotaPerMonth: { type: integer }
                      usedThisMonth: { type: integer }
                      month: { type: string, example: "2026-09" }
                      grantedByPersonId: { type: string }
                      grantedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /patients:
    get:
      tags: [Staff console]
      operationId: searchRegister
      summary: Find a patient by name, phone or patient number (FR-STF-06)
      description: |
        Permission patient.read at clinic scope or wider: a hospital keeps one
        register, so any unit's desk finds any of its patients. Every search is
        an audit entry naming the patients it showed.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        "200":
          description: The matches.
          content:
            application/json:
              schema: 
                type: object
                properties:
                  q: { type: string }
                  count: { type: integer }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/RegisterEntry" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Staff console]
      operationId: createDeskPatient
      summary: A minimal record made at the desk, with no account (FR-BKG-07)
      description: |
        Permission patient.create. A name and a mobile number, the date of
        birth and language if known. A number another patient already holds is
        refused with those patients named, unless sameNumberConfirmed says the
        desk has seen them: families share a phone. The patient number is the
        hospital's own, for example RHB-000123.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [givenName, familyName, phoneE164]
              properties:
                givenName: { type: string, maxLength: 60 }
                familyName: { type: string, maxLength: 60 }
                phoneE164: { type: string, example: "+237600000001" }
                dateOfBirth: { type: string, format: date }
                preferredLanguage: { type: string, enum: [fr, en] }
                sameNumberConfirmed: { type: boolean }
      responses:
        "201":
          description: The new record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterEntry" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /patients/{id}:
    get:
      tags: [Staff console]
      operationId: getPatientRecord
      summary: A patient's record, with the visits in the caller's scope (FR-STF-07)
      description: |
        Permission patient.read. Contact details and verification, whether the
        patient has an account, and up to 50 visits: a unit's staff see their
        unit's, a clinician their own, an administrator all. Care context is
        never on the record (FR-PRV-10). Every read is an audit entry.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: 
                type: object
                properties:
                  patientProfileId: { type: string }
                  patientNumber: { type: string }
                  givenName: { type: string }
                  familyName: { type: string }
                  dateOfBirth: { type: [string, "null"], format: date }
                  phoneE164: { type: [string, "null"] }
                  email: { type: [string, "null"] }
                  preferredLanguage: { type: [string, "null"] }
                  hasAccount: { type: boolean }
                  phoneVerified: { type: boolean }
                  emailVerified: { type: boolean }
                  source: { type: string, enum: [SELF, DESK] }
                  createdAt: { type: string, format: date-time }
                  visitScope: { $ref: "#/components/schemas/Scope" }
                  appointments:
                    type: array
                    items: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinics/{id}/roster:
    get:
      tags: [Staff console]
      operationId: getRoster
      summary: The unit's clinicians on a day, and how full each day is (FR-STF-08)
      description: |
        Permission availability.read at clinic scope. Status is OFF, LEAVE,
        UNAVAILABLE, LATER, ON_SHIFT or FINISHED today, SCHEDULED on another
        day. Names no patient, so it is not an audit entry.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: The roster.
          content:
            application/json:
              schema: 
                type: object
                properties:
                  clinicId: { type: string }
                  date: { type: string, format: date }
                  timezone: { type: string }
                  onShift: { type: integer }
                  clinicians:
                    type: array
                    items:
                      type: object
                      properties:
                        clinicianProfileId: { type: string }
                        givenName: { type: string }
                        familyName: { type: string }
                        specialty: { type: [string, "null"] }
                        status: { type: string }
                        startsAt: { type: [string, "null"] }
                        endsAt: { type: [string, "null"] }
                        timeOff: { type: array, items: { type: object } }
                        visits: { type: integer }
                        bookedMinutes: { type: integer }
                        workingMinutes: { type: integer }
                        load: { type: [number, "null"] }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /audit/changes:
    get:
      tags: [Audit]
      operationId: weeklyChanges
      summary: A week's staff reschedules and cancellations, by who made them (FR-STF-13)
      description: |
        Permission audit.read. Read from the audit trail, so it cannot disagree
        with it. The week is the Monday given (UTC days), this week by default.
        Each actor's changes carry their reasons and flags, flagged ones first,
        including POTENTIAL_SELF_BENEFIT (guard REASONED_AND_AUDITED).
      parameters:
        - name: week
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: The week's changes.
          content:
            application/json:
              schema: 
                type: object
                properties:
                  week: { type: string, format: date }
                  to: { type: string, format: date }
                  total: { type: integer }
                  flagged: { type: integer }
                  actors:
                    type: array
                    items:
                      type: object
                      properties:
                        actorPersonId: { type: string }
                        actorName: { type: string }
                        actorRole: { type: [string, "null"] }
                        cancellations: { type: integer }
                        reschedules: { type: integer }
                        flagged: { type: integer }
                        changes: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /clinics/{id}/sessions:
    get:
      tags: [Queue and requests]
      operationId: listSessions
      summary: The unit's sessions, to join or book into (FR-BKG-09)
      description: |
        Two weeks from today by default, a month at most. A patient sees only
        the open ones still to come; staff see all of them.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema: 
                type: object
                properties:
                  clinicId: { type: string }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Queue and requests]
      operationId: publishSession
      summary: A unit manager publishes a session (FR-BKG-10)
      description: |
        Permission session.publish. The window and the doctors rostered;
        capacity is worked out from them and the unit's measured pace, and a
        body that sets it is refused. A session may not overlap another open one.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, startTime, endTime, rosteredClinicianCount]
              properties:
                date: { type: string, format: date }
                startTime: { type: string, example: "08:00" }
                endTime: { type: string, example: "12:00" }
                rosteredClinicianCount: { type: integer, minimum: 1 }
      responses:
        "201":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{id}:
    get:
      tags: [Queue and requests]
      operationId: getSession
      summary: One session, with how full it is
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{id}/tickets:
    post:
      tags: [Queue and requests]
      operationId: issueTicket
      summary: A place in the queue, for oneself or at the desk (FR-BKG-11, FR-BKG-13)
      description: |
        Permission appointment.create. A patient takes their own place online;
        the desk takes one for a walk-in or a caller. The position and arrival
        window are the server's, from the order requests arrived in: a body
        that names either is refused (guard SERVER_ASSIGNED_ORDER). A ticket is
        also an appointment, so it appears in the patient's visits.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                patientProfileId:
                  type: string
                  description: Required at the desk; a patient's own place needs none.
                channel: { type: string, enum: [WALK_IN, PHONE], default: WALK_IN }
      responses:
        "201":
          description: The ticket, with its position and arrival window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{id}/queue:
    get:
      tags: [Queue and requests]
      operationId: liveQueue
      summary: The desk's live queue, in position order (FR-BKG-13)
      description: |
        Permission queue.read at clinic scope, staff only. Recalculates
        arrival windows first, then lists every ticket with the patients'
        names, the counts waiting, arrived and in consultation, and the planned
        against the actual pace so far. Each ticket carries the fee it will be
        asked for at the hospital, from the fee band in force on the session
        date (looked up once per appointment type), and walkInFee is the same
        for the unit's general consultation, which is what a walk-in takes.
        A fee is a plain amount: it carries no rating or score, and nothing
        in Atria collects it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: 
                allOf:
                  - $ref: "#/components/schemas/Session"
                  - type: object
                    properties:
                      appointments:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/Appointment"
                            - type: object
                              description: What the desk needs to see about a ticket (ADR 0022).
                              properties:
                                due: { type: boolean, description: Waiting and its arrival window has opened. }
                                late: { type: boolean, description: Past its window and grace, or its hold ran out. Lateness forfeits priority. }
                                bypassCount: { type: integer, description: Consultations started ahead of this ticket while it was due and absent. }
                                urgent: { type: boolean }
                                invite: { $ref: "#/components/schemas/EarlyCallInvite" }
                                fee: { $ref: "#/components/schemas/DeskFee" }
                      walkInFee: { $ref: "#/components/schemas/DeskFee" }
                      patients: { $ref: "#/components/schemas/PatientNames" }
                      waiting: { type: integer }
                      arrived: { type: integer }
                      inConsultation: { type: integer }
                      seen: { type: integer }
                      plannedPerHour: { type: number }
                      actualPerHour: { type: [number, "null"] }
                      invites:
                        type: object
                        description: What the desk may do about early-call invitations now (ADR 0022 R4).
                        properties:
                          mode: { type: string, enum: [desk, auto] }
                          fanout: { type: integer }
                          openMinutes: { type: integer }
                          open: { type: integer, description: Invitations open now. }
                          eligible: { type: array, items: { type: string }, description: Tickets the rules allow inviting right now. }
                      callPreview:
                        type: object
                        description: What calling the next patient would do now, so the desk sees the cost first.
                        properties:
                          candidate: { type: [string, "null"], description: The appointment id that would be called, or null when nobody is here or the doctor is held. }
                          bypassed:
                            type: array
                            description: Due, absent tickets the call would pass over.
                            items:
                              type: object
                              properties:
                                appointmentId: { type: string }
                                position: { type: integer }
                                windowEnd: { type: [string, "null"], format: date-time }
                          hold:
                            type: [object, "null"]
                            description: Set when the next free doctor is held for a booked patient already passed over once.
                            properties:
                              appointmentId: { type: string }
                              position: { type: integer }
                              until: { type: string, format: date-time }
                          expectedConsultMinutes: { type: number, description: The median of this session's consultations, or the pace before any is measured. }
                          wouldBreachWindow: { type: boolean, description: True when the call is expected to run past a bypassed ticket's arrival window. }
                      policy: { $ref: "#/components/schemas/QueuePolicy" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{id}/next:
    post:
      tags: [Queue and requests]
      operationId: callNext
      summary: A doctor takes the next patient who is here
      description: |
        Permission queue.assign_next. The calling clinician, or one named by
        the desk, is assigned the next ticket among those who have arrived (ADR
        0022): urgent first, then by position, with late arrivals behind
        everyone present. The doctor never waits when someone is here, except
        that a booked patient already passed over once (due and not arrived)
        holds the next free doctor for a few minutes. That answers 409 with
        detail rule HELD_FOR_BOOKED_PATIENT, heldFor, position and until. The
        desk may override with overrideHold and a reason; the reason is kept on
        the consultation. No doctor is named on a ticket before this.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clinicianProfileId: { type: string, description: Required when the caller is not a clinician. }
                overrideHold: { type: boolean, description: Call the next patient who is here even though the doctor is held for a booked patient. Needs a reason. }
                reason: { type: string, maxLength: 200, description: Required with overrideHold. }
      responses:
        "200":
          description: The ticket now in consultation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /clinics/{id}/queue-policy:
    get:
      tags: [Queue and requests]
      operationId: getUnitQueuePolicy
      summary: The queue rules in force for a unit, and which level set each
      description: Permission queue.read at clinic scope.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The rules in force for the unit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueuePolicy" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Queue and requests]
      operationId: setUnitQueuePolicy
      summary: A unit's own queue rules, over the tenant's defaults (ADR 0022)
      description: |
        Permission queue.configure at clinic scope: the unit manager for their
        unit, the administrator for any. Send only the rules to change; null
        clears an override so the tenant's default applies again. The tenant's
        defaults are set through PATCH /admin/settings (queueHoldMinutes,
        queueLateGraceMinutes, queueMaxBypass, queueInviteLeadMinutes,
        queueInviteFanout, queueInviteOpenMinutes, queueEarlyCallInvites).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueuePolicyChange" }
      responses:
        "200":
          description: The rules now in force for the unit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueuePolicy" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{id}/policy:
    patch:
      tags: [Queue and requests]
      operationId: setSessionQueuePolicy
      summary: The desk adjusts the queue rules for one session (ADR 0022)
      description: |
        Permission queue.tune_session at clinic scope: the desk and the unit
        manager. It overrides the unit and the tenant for this session only.
        null clears an override. A closed session is refused.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueuePolicyChange" }
      responses:
        "200":
          description: The rules now in force for the session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueuePolicy" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{id}/invites:
    post:
      tags: [Queue and requests]
      operationId: sendEarlyCallInvites
      summary: The desk invites booked patients to come early (ADR 0022 R4)
      description: |
        Permission queue.invite at clinic scope: the receptionist and the unit
        manager. Invites the absent waiting tickets the rules allow now, by
        position: only while nobody is here, a doctor is free or within the lead
        time of being free, and fewer than the fan-out are open. Each ticket is
        invited at most once; each invitation owes the patient one SMS
        (EARLY_CALL_INVITE) and a push. An invitation never holds the doctor and
        moves nobody. With mode auto the same rules run by themselves when the
        desk's live queue is read and after a call.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                appointmentIds:
                  type: array
                  minItems: 1
                  items: { type: string }
                  description: Invite only these, which must be among those the rules allow now.
      responses:
        "200":
          description: The tickets invited.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invited: { type: array, items: { type: string } }
                  openMinutes: { type: integer }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{id}/close:
    post:
      tags: [Queue and requests]
      operationId: closeSession
      summary: Close a session, recording the pace it achieved
      description: |
        Permission session.publish. The actual throughput is measured from the
        consultations seen and feeds the next session's capacity.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The closed session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /procedure-requests:
    post:
      tags: [Queue and requests]
      operationId: requestProcedure
      summary: A patient asks for a procedure; no time is held (FR-BKG-14)
      description: |
        Permission procedure.request. Only a type the unit offers to be
        requested. The request is an appointment in REQUESTED on the unit's
        inbox; the patient follows it in their visits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clinicId, appointmentTypeId]
              properties:
                clinicId: { type: string }
                appointmentTypeId: { type: string }
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /clinics/{id}/requests:
    get:
      tags: [Queue and requests]
      operationId: listRequests
      summary: The unit's inbox of procedure requests waiting (FR-STF-15)
      description: Permission procedure.size_and_place at clinic scope.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The requests, oldest first, with the patients' names.
          content:
            application/json:
              schema: 
                type: object
                properties:
                  clinicId: { type: string }
                  count: { type: integer }
                  appointments: { type: array, items: { $ref: "#/components/schemas/Appointment" } }
                  patients: { $ref: "#/components/schemas/PatientNames" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /appointments/{id}/place:
    post:
      tags: [Queue and requests]
      operationId: placeRequest
      summary: Size and place a request, a clinician and a time (FR-STF-15)
      description: |
        Permission procedure.size_and_place. Locks the units in one transaction
        and moves the request to BOOKED; the patient's own confirmation then
        makes it CONFIRMED.
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clinicianProfileId, startAt]
              properties:
                clinicianProfileId: { type: string }
                startAt: { type: string, format: date-time }
                durationUnits: { type: integer, minimum: 1, maximum: 48 }
      responses:
        "200": { $ref: "#/components/responses/MovedAppointment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /appointments/{id}/decline:
    post:
      tags: [Queue and requests]
      operationId: declineRequest
      summary: Decline a request, with a reason the patient reads
      description: Permission procedure.size_and_place, staff only. The patient is told.
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/MovedAppointment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /clinics/{id}/report:
    get:
      tags: [Reports and messages]
      operationId: unitReport
      summary: A unit's week in figures (FR-MSR-01, FR-MSR-02, FR-MSR-04, FR-MSR-07)
      description: |
        Permission report.read: a unit manager their unit, an administrator any.
        The week is the Monday given on the tenant's clock, this week by
        default, back to the first day of use. Counts only, so not an audit
        entry. No figure claims what reminders saved in money, and the ledger
        is a record, not money moved.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: week
          in: query
          schema: { type: string, format: date }
        - name: before
          in: query
          description: |
            A date in an earlier period of the same length (granularity). When
            given, the response carries `comparison`: counts before and after,
            and attendance in points. The earlier period must end before this
            one begins. A difference is reported, never a cause.
          schema: { type: string, format: date }
      responses:
        "200":
          description: The unit's week.
          content:
            application/json:
              schema: 
                allOf:
                  - $ref: "#/components/schemas/Figures"
                  - type: object
                    properties:
                      clinicId: { type: string }
                      clinicName: { type: [string, "null"] }
                      week: { type: string, format: date }
                      to: { type: string, format: date }
                      firstDay: { type: [string, "null"], format: date }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports:
    get:
      tags: [Reports and messages]
      operationId: hospitalReport
      summary: Every unit's week, for the administrator
      parameters:
        - name: week
          in: query
          schema: { type: string, format: date }
        - name: before
          in: query
          description: |
            A date in an earlier period of the same length (granularity). When
            given, the response carries `comparison`: counts before and after,
            and attendance in points. The earlier period must end before this
            one begins. A difference is reported, never a cause.
          schema: { type: string, format: date }
      responses:
        "200":
          description: The hospital's week, and each unit's, busiest first.
          content:
            application/json:
              schema: 
                type: object
                properties:
                  week: { type: string, format: date }
                  to: { type: string, format: date }
                  firstDay: { type: [string, "null"], format: date }
                  booked: { type: integer }
                  attended: { type: integer }
                  noShow: { type: integer }
                  cancelled: { type: integer }
                  lateCancelled: { type: integer }
                  units: { type: array, items: { $ref: "#/components/schemas/Figures" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /clinics/{id}/messages:
    get:
      tags: [Reports and messages]
      operationId: unitMessages
      summary: What went out for a unit on a day, failures first (FR-MSG-05)
      description: |
        Permission message.read: the front desk and a unit manager their unit,
        an administrator any. A message joins a day's log when it settles, on
        the tenant's clock; a reminder still waiting is in none. Each row names
        the patient and the number on file now, so the desk can phone those a
        message did not reach.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: day
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: The day's log.
          content:
            application/json:
              schema: 
                type: object
                properties:
                  clinicId: { type: string }
                  clinicName: { type: [string, "null"] }
                  day: { type: string, format: date }
                  counts:
                    type: object
                    additionalProperties: { type: integer }
                  messages: { type: array, items: { $ref: "#/components/schemas/LoggedMessage" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /messages/usage:
    get:
      tags: [Reports and messages]
      operationId: messageUsage
      summary: A month of messages counted by unit, kind, channel and state (ADR 0031)
      description: |
        Permission message.read at tenant scope, the administrator's. Counts
        the message log rows that settled in the month on the tenant's clock,
        a running month to today. Reporting only: no price, no invoice.
      parameters:
        - name: month
          in: query
          description: YYYY-MM, this month by default.
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  messages: { type: integer }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        clinicId: { type: string }
                        kind: { type: string }
                        channel: { type: string }
                        state: { type: string }
                        count: { type: integer }
                  byKind: { type: object, additionalProperties: { type: integer } }
                  byChannel: { type: object, additionalProperties: { type: integer } }
                  byState: { type: object, additionalProperties: { type: integer } }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /messages/delivery:
    get:
      tags: [Reports and messages]
      operationId: deliveryFigures
      summary: Delivery, bounce and complaint rates and SMS spend per day (FR-MSG-06)
      description: |
        Permission message.read at tenant scope, the administrator's. Counts
        what SES and SNS reported (FR-MSG-04); a rate is null where nothing was
        attempted. The sender identities, and whether email and SMS are still
        in their sandboxes, come from the account itself and are null when it
        could not be asked.
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 31, default: 14 }
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema: 
                type: object
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  senders:
                    type: [array, "null"]
                    items:
                      type: object
                      properties:
                        identity: { type: string }
                        type: { type: string }
                        verified: { type: boolean }
                        sendingEnabled: { type: boolean }
                        sandbox: { type: boolean }
                  sms:
                    type: [object, "null"]
                    properties:
                      sandbox: { type: boolean }
                  totals: { $ref: "#/components/schemas/DeliveryFigures" }
                  days:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/DeliveryFigures"
                        - type: object
                          properties:
                            day: { type: string, format: date }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  parameters:
    AppointmentId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: The appointment id, scoped to the caller's tenant.

    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      description: |
        How many items one page holds, at most 50 (NFR-PERF-04). Every list
        answers a page at a time; count is the whole list's size.

    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: The nextCursor of the page before. Opaque; a cursor this list did not give out is refused with 400.

    ClinicianId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: The clinician's staff membership id, scoped to the caller's tenant.

    StaffId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: The staff membership id, scoped to the caller's tenant.

    AuditFrom:
      name: from
      in: query
      schema: { type: string, format: date }
      description: The first UTC day. A week before `to` by default.

    AuditTo:
      name: to
      in: query
      schema: { type: string, format: date }
      description: The last UTC day, included. Today by default. At most 31 days after `from`.

    AuditActor:
      name: actor
      in: query
      schema: { type: string }
      description: Only this person's entries (their personId or staff id).

    AuditAction:
      name: action
      in: query
      schema: { type: string, example: appointment.cancel }
      description: One action, or a family of them ("appointment" is every appointment action).

    AuditKind:
      name: kind
      in: query
      schema: { type: string, enum: [READ, WRITE] }
      description: Reads of patient data, or changes.

  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Cognito access token from the patient, staff or admin app client. The
        token carries the tenant, the person and the roles the account was
        created with.

  schemas:
    QueuePolicyChange:
      type: object
      description: Rules to change; null clears an override. At least one.
      properties:
        holdMinutes: { type: [integer, "null"], minimum: 0, maximum: 30, description: How long the next free doctor is held for a booked patient already passed over. 0 never holds. }
        lateGraceMinutes: { type: [integer, "null"], minimum: 0, maximum: 60, description: Minutes after a window ends before an absent patient is late. }
        maxBypass: { type: [integer, "null"], minimum: 0, maximum: 3, description: Consultations that may start ahead of a due, absent patient before the doctor is held. }
        inviteLeadMinutes: { type: [integer, "null"], minimum: 0, maximum: 30, description: How many minutes before a doctor is expected to be free that early-call invitations may go out (ADR 0022 R4). }
        inviteFanout: { type: [integer, "null"], minimum: 0, maximum: 10, description: How many invitations may be out at once. 0 sends none. }
        inviteOpenMinutes: { type: [integer, "null"], minimum: 5, maximum: 120, description: How long an invitation stays open, and the time the patient is asked to arrive within. }
        earlyCallInvites: { type: [string, "null"], enum: [desk, auto, null], description: "desk: only the desk sends invitations. auto: the system sends them when a doctor is about to be free and nobody is here." }
    EarlyCallInvite:
      type: [object, "null"]
      description: A ticket's early-call invitation, or null if it was never invited.
      properties:
        status: { type: string, enum: [open, accepted, declined, expired] }
        sentAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        answer: { type: [string, "null"], enum: [YES, NO, null] }
        eta: { type: [string, "null"], format: date-time }
    QueuePolicy:
      type: object
      properties:
        holdMinutes: { type: integer }
        lateGraceMinutes: { type: integer }
        maxBypass: { type: integer }
        inviteLeadMinutes: { type: integer }
        inviteFanout: { type: integer }
        inviteOpenMinutes: { type: integer }
        earlyCallInvites: { type: string, enum: [desk, auto] }
        source:
          type: object
          description: Which level set each rule (session, unit, tenant or default).
          additionalProperties: { type: string, enum: [session, unit, tenant, default] }
    TenantSettings:
      type: object
      properties:
        name: { type: string }
        regionPackCode: { type: string, example: CM }
        gridUnitMinutes: { type: integer, enum: [5, 10, 15, 20, 30] }
        languages: { type: array, items: { type: string } }
        reminderLeadHours: { type: integer, minimum: 1, maximum: 72 }
        secondReminderHours: { type: integer, minimum: 0, maximum: 12, description: "0 is off" }
        queueMoveThresholdMinutes: { type: integer, minimum: 10, maximum: 120 }
        queueInviteLeadMinutes: { type: integer, minimum: 0, maximum: 30 }
        queueInviteFanout: { type: integer, minimum: 0, maximum: 10 }
        queueInviteOpenMinutes: { type: integer, minimum: 5, maximum: 120 }
        queueEarlyCallInvites: { type: string, enum: [desk, auto] }
        noShowStrikeThreshold: { type: integer, minimum: 0, maximum: 10, description: "0 is off" }
        noShowStrikeWindowDays: { type: integer, minimum: 30, maximum: 365 }
        qualityProgrammeEnabled: { type: boolean }
        ratingAffectsFee: { type: boolean }
        guardianConsent: { type: string, enum: [DESK_OR_GUARDIAN_ACCOUNT] }
        smsSenderId: { type: string, pattern: "^[A-Za-z][A-Za-z0-9]{2,10}$" }
        emailSenderName: { type: string, maxLength: 60 }
        firstAppointmentAt: { type: [string, "null"], format: date-time, readOnly: true }
        regionPackLocked: { type: boolean, readOnly: true }
        lockReason: { type: [string, "null"], readOnly: true }

    AppointmentTypeSettings:
      type: object
      properties:
        appointmentTypeId: { type: string, readOnly: true }
        name: { type: string, maxLength: 80 }
        code: { type: string }
        serviceLine: { type: string, enum: [GENERAL, SPECIALIST, PROCEDURE] }
        durationUnits: { type: [integer, "null"], minimum: 1, maximum: 48 }
        bufferUnits: { type: integer, minimum: 0, maximum: 12 }
        bookableBy: { type: string, enum: [PATIENT, STAFF, BOTH] }
        patientRequestable: { type: boolean }
        minNoticeMinutes: { type: integer }
        maxAdvanceDays: { type: integer }
        cancellationWindowMinutes: { type: integer }
        feeBandId: { type: string }
        clinicIds: { type: [array, "null"], items: { type: string } }
        active: { type: boolean }

    FeeBand:
      type: object
      properties:
        feeBandId: { type: string }
        practice: { type: string }
        baseAmountMinor: { type: integer, description: Whole XAF }
        scheduleReference: { type: string }
        effectiveFrom: { type: string, format: date }

    AuditEntry:
      type: object
      description: One recorded action. Written once, never changed.
      properties:
        auditEntryId: { type: string }
        occurredAt: { type: string, format: date-time }
        actorPersonId: { type: string }
        actorName: { type: string }
        actorRole: { type: [string, "null"], enum: [RECEPTIONIST, CLINICIAN, CLINIC_MANAGER, TENANT_ADMIN, null] }
        action: { type: string, example: appointment.read }
        kind: { type: string, enum: [READ, WRITE] }
        subjectType: { type: string, enum: [APPOINTMENT, CLINIC, CLINICIAN, STAFF, AUDIT_LOG] }
        subjectId: { type: string }
        clinicId: { type: [string, "null"] }
        patientCount: { type: integer }
        reason: { type: [string, "null"] }
        flags:
          type: array
          items: { type: string, enum: [POTENTIAL_SELF_BENEFIT] }
        source:
          type: object
          properties:
            ip: { type: string }

    Span:
      type: object
      required: [start, end]
      properties:
        start: { type: string, example: "08:00" }
        end: { type: string, example: "16:00" }

    WeekHours:
      type: object
      description: Weekday (0 Monday to 6) to a working span; a weekday not listed is off.
      additionalProperties: { $ref: "#/components/schemas/Span" }

    TimeOff:
      type: object
      required: [groupId, kind, from, to]
      properties:
        groupId: { type: string }
        kind: { type: string, enum: [BLOCK, LEAVE, UNAVAILABLE] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        startTime: { type: [string, "null"] }
        endTime: { type: [string, "null"] }
        reason: { type: [string, "null"] }

    Role:
      type: string
      enum: [PATIENT, RECEPTIONIST, CLINICIAN, CLINIC_MANAGER, TENANT_ADMIN]
      description: Generated from spec/atria_spec/roles.py.

    Scope:
      type: string
      enum: [own, clinic, tenant]
      description: How far a granted permission reaches. Refused permissions are absent.

    Me:
      type: object
      additionalProperties: false
      required:
        - personId
        - tenantId
        - roles
        - phoneVerified
        - languages
        - permissions
        - landing
      properties:
        personId:
          type: string
          description: The person behind the account. One human being.
        givenName:
          type: [string, "null"]
          description: From the person record. Null for an account with none yet.
        familyName:
          type: [string, "null"]
          description: From the person record. Null for an account with none yet.
        email:
          type: [string, "null"]
          description: The caller's own email, from the person record.
        phoneE164:
          type: [string, "null"]
          description: The caller's own mobile, from the person record.
        tenantId:
          type: string
          description: The institution. Every record the caller can reach belongs to it.
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        patientProfileId:
          type: [string, "null"]
          description: Present when this person holds a patient profile.
        staffId:
          type: [string, "null"]
          description: Present when the account is a staff membership.
        clinicId:
          type: [string, "null"]
          description: The clinic a staff membership belongs to. Bounds clinic scope.
        phoneVerified:
          type: boolean
          description: Set only by the one-time code, whatever the identity provider returned.
        languages:
          type: array
          items: { type: string }
          description: Language tags from the region pack, for example fr and en.
        permissions:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Scope" }
          description: |
            Permission to scope, widest scope winning where an account holds
            more than one role. A permission the account cannot use is absent
            rather than present with a none scope.
        landing:
          type: array
          items: { type: string }
          description: The screen each role lands on after signing in.
        secondFactorRequired:
          type: boolean
          description: |
            True for a tenant administrator whose sign-in carried no
            authenticator (FR-ACC-11). The role grants nothing until they
            set one up and sign in with it; the console asks for that first.

    CreateStaffAccount:
      type: object
      additionalProperties: false
      required: [givenName, familyName, phoneE164, roles]
      description: |
        Every field the requested roles require must be present; which fields
        those are depends on the roles, and is read from
        spec/atria_spec/roles.py REQUIRED_ON_CREATE.
      properties:
        givenName: { type: string }
        familyName: { type: string }
        phoneE164:
          type: string
          description: E.164, for example +237600000001.
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
          description: PATIENT is refused here; a staff account never carries it.
        clinicId:
          type: string
          description: Required for a role scoped to a clinic (receptionist, clinician, clinic manager).
        email:
          type: string
          description: Required for a tenant administrator; the sign-in name when there is no clinic.
        employeeNumber: { type: string }
        specialty:
          type: string
          description: Required for a clinician.
        registrationYear:
          type: integer
          description: Required for a clinician. Year entered on the Order's roll.
        ordreNumber:
          type: string
          description: Required for a clinician.
        languages:
          type: array
          items: { type: string }
          description: Required for a clinician.
        qualifications:
          type: array
          items: { type: string }

    ClinicianDetails:
      type: object
      required: [staffId, specialty, registrationYear, languages, qualifications]
      properties:
        staffId: { type: string }
        specialty: { type: string }
        registrationYear: { type: integer }
        ordreNumber: { type: [string, "null"] }
        languages: { type: array, items: { type: string } }
        qualifications: { type: array, items: { type: string } }
    StaffAccount:
      type: object
      additionalProperties: false
      required: [staffId, personId, tenantId, roles, status]
      properties:
        staffId: { type: string }
        personId: { type: string }
        tenantId: { type: string }
        clinicId: { type: [string, "null"] }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        status:
          type: string
          enum: [INVITED, ACTIVE, SUSPENDED, ENDED]
        givenName: { type: [string, "null"] }
        familyName: { type: [string, "null"] }
        phoneE164: { type: [string, "null"] }
        email: { type: [string, "null"] }
        employeeNumber: { type: [string, "null"] }
        signInName:
          type: string
          description: What the account signs in with, its email where it has one, else its mobile. On the create and list responses.
        temporaryPassword:
          type: string
          description: |
            Present only on the create response, and only there: it is
            returned once for the administrator to pass on out of band, never
            stored and never logged.
        note:
          type: string
          description: A short note on what the caller should know, for example when a role change takes effect.

    ListedClinician:
      type: object
      additionalProperties: false
      required: [clinicianProfileId, familyName, seniorityBand]
      description: |
        What a directory listing may carry. Deliberately no score, no rating
        and no aggregate of feedback, at any scope (ADR 0011).
      properties:
        clinicianProfileId: { type: string }
        clinicId: { type: [string, "null"] }
        givenName: { type: [string, "null"] }
        familyName: { type: [string, "null"] }
        specialty: { type: [string, "null"] }
        qualifications:
          type: array
          items: { type: string }
        registrationYear:
          type: [integer, "null"]
          description: The year entered on the Order's roll, which is what the ordering uses.
        seniorityBand:
          type: string
          enum: [SENIOR, EXPERIENCED, ESTABLISHED, RECENT]
          description: Derived from the registration year at account creation.
        languages:
          type: array
          items: { type: string }

    ListedClinic:
      type: object
      additionalProperties: false
      required: [clinicId, name]
      properties:
        clinicId: { type: string }
        name: { type: string }
        address: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        openingHours:
          type: [object, "null"]
          description: Local opening and closing times by weekday, 0 for Monday.
          additionalProperties:
            type: object
            properties:
              start: { type: string, example: "08:00" }
              end: { type: string, example: "17:00" }

    ListedAppointmentType:
      type: object
      additionalProperties: false
      required: [appointmentTypeId, name, serviceLine, bookableBy]
      properties:
        appointmentTypeId: { type: string }
        code: { type: [string, "null"] }
        name: { type: string }
        serviceLine:
          type: string
          enum: [GENERAL, SPECIALIST, PROCEDURE]
        durationUnits:
          type: [integer, "null"]
          description: In grid units. Null for a queued general consultation.
        bufferUnits: { type: [integer, "null"] }
        bookableBy:
          type: string
          enum: [PATIENT, STAFF, BOTH]
        minNoticeMinutes: { type: [integer, "null"] }
        maxAdvanceDays: { type: [integer, "null"] }
        cancellationWindowMinutes:
          type: [integer, "null"]
          description: Cancelling at least this long before the start is in window (D-07).
        feeAmountMinor:
          type: [integer, "null"]
          description: The practice fee in force, in whole currency units, told to the patient before booking. Null when the type has no fee band. Nothing is collected online (D-07).
        feeCurrency:
          type: [string, "null"]
          description: The currency of the region pack, such as XAF.

    FreeStartsWeek:
      type: object
      additionalProperties: false
      required: [clinicianProfileId, from, to, appointmentTypeId, days]
      properties:
        clinicianProfileId: { type: string }
        clinicId: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        appointmentTypeId: { type: string }
        gridUnitMinutes: { type: integer }
        durationUnits: { type: integer }
        days:
          type: object
          description: Every date from from to to, each with its starts in time order, as slots are on one date.
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [startAt, endAt]
              properties:
                startAt: { type: string, format: date-time }
                endAt: { type: string, format: date-time }
    FreeStarts:
      type: object
      additionalProperties: false
      required: [clinicianProfileId, date, appointmentTypeId, slots]
      properties:
        clinicianProfileId: { type: string }
        clinicId:
          type: string
          description: From the clinician's membership.
        date: { type: string, format: date }
        appointmentTypeId: { type: string }
        gridUnitMinutes:
          type: integer
          description: The tenant's calendar resolution, so a client can render the grid.
        durationUnits:
          type: integer
          description: The type's duration in grid units, buffer excluded.
        slots:
          type: array
          description: In time order. Empty when the clinic is closed or nothing is free.
          items:
            type: object
            additionalProperties: false
            required: [startAt, endAt]
            properties:
              startAt: { type: string, format: date-time }
              endAt:
                type: string
                format: date-time
                description: The duration end, which is what the patient is told, not the buffer.

    BookAppointment:
      type: object
      additionalProperties: false
      required: [appointmentTypeId, clinicianProfileId, startAt]
      description: |
        clinicId is deliberately absent: it comes from the clinician's
        membership. endAt, state, version and the other derived fields are
        refused if supplied rather than being ignored.
      properties:
        patientProfileId:
          type: string
          description: |
            Who the appointment is for. Required when staff book; ignored when
            a patient books, because a patient books only for themselves.
        appointmentTypeId:
          type: string
          description: Carries the duration and buffer in grid units, and the booking window.
        clinicianProfileId:
          type: string
          description: The staff membership of the clinician being booked. Decides the clinic.
        startAt:
          type: string
          format: date-time
          description: |
            An ISO 8601 instant carrying a UTC offset, on a grid unit boundary.
            A value without an offset is refused rather than read as UTC.
        channel:
          type: string
          enum: [ONLINE, WALK_IN, PHONE, REFERRAL]
          default: ONLINE
          description: How the booking reached the clinic. Independent of the type (D-12).
        referralId:
          type: string
          description: Where a specialist appointment came from, where there is a referral.
        careContextId:
          type: string
          description: What the patient chose to send ahead of this one visit.
        reason:
          type: string
          description: Recorded on the appointment's first event.

    DeskFee:
      type: [object, "null"]
      description: |
        The fee a visit will be asked for at the hospital, from the band in
        force on the day, in whole currency units; zero is free. Null when the
        visit's type has no fee band. A plain amount: no rating or score
        touches it, and Atria collects nothing.
      properties:
        amountMinor: { type: integer, minimum: 0 }
        currency: { type: string, description: The region pack's currency, for example XAF. }
    PatientNames:
      type: object
      description: |
        The name of every patient on a staff list, keyed by patient profile id.
        A profile whose person has no name on record yet maps to nulls rather
        than being left out, so a list never has an appointment it cannot
        label.
      additionalProperties:
        type: object
        additionalProperties: false
        required: [givenName, familyName]
        properties:
          givenName: { type: [string, "null"] }
          familyName: { type: [string, "null"] }

    Appointment:
      type: object
      description: |
        The appointment as every operation returns it. GET /appointments/{id}
        adds the fee ledger's entry and a cancellation preview (AppointmentRecord).
      required: [appointmentId, reference, tenantId, clinicId, patientProfileId, startAt, endAt, state]
      properties:
        appointmentId: { type: string }
        reference:
          type: string
          description: What the patient quotes at the desk, for example APT-0123456789.
        tenantId: { type: string }
        clinicId:
          type: string
          description: From the clinician's membership, not from the request.
        patientProfileId: { type: string }
        appointmentTypeId: { type: string }
        clinicianProfileId:
          type: [string, "null"]
          description: Set on the specialist line. Null on the general line, which uses a session.
        sessionId:
          type: [string, "null"]
          description: |
            Set on the general line, and null here, because an appointment
            holds either a clinician and a time or a session, never both.
        startAt: { type: string, format: date-time }
        endAt:
          type: string
          format: date-time
          description: |
            From the type's durationUnits. The type's buffer is locked after
            this, so the next booking cannot start inside the turnaround, but
            it is not part of the appointment the patient is told about.
        state:
          type: string
          enum:
            [REQUESTED, DECLINED, BOOKED, CONFIRMED, RESCHEDULED, DISRUPTED, ARRIVED,
             IN_CONSULTATION, COMPLETED, AWAITING_FEEDBACK, CLINIC_CANCELLED,
             PATIENT_CANCELLED, NO_SHOW]
          description: BOOKED on creation. Confirmation is the patient's own act.
        channel:
          type: string
          enum: [ONLINE, WALK_IN, PHONE, REFERRAL]
        bookedByPersonId: { type: string }
        bookedByRole:
          type: [string, "null"]
          description: The staff role used. Null where the patient booked for themselves.
        referralId: { type: [string, "null"] }
        careContextId: { type: [string, "null"] }
        version:
          type: integer
          description: Optimistic concurrency for offline staff writes.
        createdAt: { type: string, format: date-time }
        position:
          type: [integer, "null"]
          description: A queue ticket's place, assigned by the server (guard SERVER_ASSIGNED_ORDER).
        arrivalWindowStart:
          type: [string, "null"]
          format: date-time
          description: When a queue ticket's holder should arrive from (FR-BKG-11).
        arrivalWindowEnd: { type: [string, "null"], format: date-time }
        requestNote:
          type: [string, "null"]
          description: What the patient wrote when requesting a procedure (FR-BKG-14).
        declineReason:
          type: [string, "null"]
          description: Why staff declined a procedure request; the patient reads it.

    AppointmentRecord:
      allOf:
        - $ref: "#/components/schemas/Appointment"
        - type: object
          properties:
            ledger:
              oneOf:
                - $ref: "#/components/schemas/LedgerEntry"
                - type: "null"
              description: Written when the visit closed (FR-MSR-05). Null while it is open.
            cancellationPreview:
              description: |
                What cancelling now would record, so the cancel screen can say
                it before the patient confirms (FR-MSR-06). Null once closed.
              oneOf:
                - type: "null"
                - type: object
                  properties:
                    outcome: { type: string, enum: [CANCELLED_IN_WINDOW, CANCELLED_LATE] }
                    entitlement: { type: string, enum: [FULL, PARTIAL] }
                    amountMinor: { type: [integer, "null"] }
                    currency: { type: string }
                    freeUntil: { type: string, format: date-time }
            reminders:
              description: |
                The visit's reminders as the message log has them, earliest
                first, so the timeline says sent, failed or not sent. Staff
                also read why one failed; a patient reads only the outcome.
              type: array
              items:
                type: object
                properties:
                  channel: { type: string, enum: [SMS, EMAIL] }
                  deliveryState: { type: string, enum: [SCHEDULED, SENT, DELIVERED, FAILED, CANCELLED] }
                  sentAt: { type: string, format: date-time }
                  settledAt: { type: [string, "null"], format: date-time }
                  feedback: { type: [string, "null"], description: "BOUNCE or COMPLAINT" }
                  failureReason: { type: [string, "null"], description: "Staff only." }
            history:
              description: |
                What happened to the visit, oldest first (APPOINTMENT_EVENT):
                the timeline reads it rather than the current state. A patient
                reads the role that acted and whether it was them; staff also
                read who, and every reason.
              type: array
              items:
                type: object
                properties:
                  appointmentEventId: { type: string }
                  kind: { type: string, description: "BOOKED, REQUESTED, PLACED, CONFIRMED, RESCHEDULED, DISRUPTED, CANCELLED, DECLINED, ARRIVED, CONSULTATION_STARTED, COMPLETED, NO_SHOW" }
                  fromState: { type: [string, "null"] }
                  toState: { type: string }
                  actorRole: { type: [string, "null"] }
                  actorPersonId: { type: string, description: Staff only. }
                  byYou: { type: boolean }
                  occurredAt: { type: string, format: date-time }
                  previousStartAt: { type: [string, "null"], format: date-time, description: Where a move took the visit from. }
                  rescheduledBy: { type: [string, "null"] }
                  reason: { type: [string, "null"] }

    LedgerEntry:
      type: object
      description: |
        A record of a closed visit's fee and entitlement (FR-MSR-05 to
        FR-MSR-07). No money moves through Atria; settledAt stays null.
      properties:
        feeBandId: { type: [string, "null"] }
        practice: { type: [string, "null"] }
        amountMinor:
          type: [integer, "null"]
          description: The band's amount in force on the day of the visit, in XAF.
        currency: { type: string }
        outcome:
          type: string
          enum: [ATTENDED, CANCELLED_IN_WINDOW, CANCELLED_LATE, NO_SHOW, CLINIC_CANCELLED]
        entitlement: { type: string, enum: [FULL, PARTIAL, NONE] }
        settledAt: { type: "null" }

    RegisterEntry:
      type: object
      properties:
        patientProfileId: { type: string }
        givenName: { type: string }
        familyName: { type: string }
        phoneE164: { type: [string, "null"] }
        patientNumber:
          type: string
          description: The hospital's own number, for example RHB-000123.
        dateOfBirth: { type: [string, "null"], format: date }

    Session:
      type: object
      properties:
        sessionId: { type: string }
        clinicId: { type: string }
        sessionDate: { type: string, format: date }
        startTime: { type: string, example: "08:00" }
        endTime: { type: string, example: "12:00" }
        rosteredClinicianCount: { type: integer }
        expectedThroughputPerHour:
          type: string
          description: Measured from the unit's closed sessions, per doctor.
        actualThroughputPerHour: { type: [string, "null"] }
        capacity:
          type: integer
          description: Derived from the doctors rostered and the pace; never typed (FR-BKG-10).
        issuedTickets: { type: integer }
        status: { type: string, enum: [OPEN, CLOSED] }

    Figures:
      type: object
      description: A week's visits by what became of them (FR-MSR-01, FR-MSR-02).
      properties:
        booked: { type: integer }
        attended: { type: integer }
        noShow: { type: integer }
        cancelled: { type: integer }
        lateCancelled: { type: integer }
        open: { type: integer }
        attendance:
          type: [number, "null"]
          description: Attended over attended and no-show. Null when neither happened.
        queue:
          type: [object, "null"]
          description: |
            What the general queue measured (ADR 0022), null for a unit with no
            queue in the period. Measurements only: no price, no saving. A
            breach is against the arrival window as last told to the patient.
            For the hospital report the medians are null, since they do not add.
          properties:
            tickets: { type: integer }
            seen: { type: integer }
            byChannel: { type: object, additionalProperties: { type: integer } }
            medianWaitMinutes: { type: [number, "null"], description: Arrival to the start of the consultation. }
            medianConsultationMinutes: { type: [number, "null"] }
            arrivedInWindow: { type: integer }
            promiseBreached: { type: integer, description: Arrived in their window and seen after it ended. }
            medianBreachMinutes: { type: [number, "null"] }
            longestBreachMinutes: { type: [number, "null"] }
            bypassed: { type: integer }
            urgent: { type: integer }
            late: { type: integer }
            doctorIdleWhileWaitingMinutes:
              type: number
              description: A doctor free between two consultations while a patient of the unit had arrived and waited.
        byChannel:
          type: array
          items:
            type: object
            properties:
              channel: { type: string }
              booked: { type: integer }
              attended: { type: integer }
              noShow: { type: integer }
              attendance: { type: [number, "null"] }
        byBookedBy:
          type: array
          description: |
            Who made the booking: the patient, or which staff role on their
            behalf. Kept apart from the channel, which is how the patient
            reached the unit. The hospital-wide report sums each unit's.
          items:
            type: object
            properties:
              bookedBy: { type: string, enum: [PATIENT, RECEPTIONIST, CLINICIAN, CLINIC_MANAGER, TENANT_ADMIN] }
              booked: { type: integer }
              attended: { type: integer }
              noShow: { type: integer }
              attendance: { type: [number, "null"] }
        byReminder:
          type: array
          description: Shown side by side with attendance, not as cause and effect (FR-MSR-04).
          items:
            type: object
            properties:
              reminder: { type: string, enum: [SENT, DELIVERED, FAILED, NOT_SENT] }
              booked: { type: integer }
              attended: { type: integer }
              noShow: { type: integer }
              attendance: { type: [number, "null"] }
        ledger:
          type: object
          properties:
            entries: { type: integer }
            currency: { type: string }
            byEntitlement:
              type: array
              items:
                type: object
                properties:
                  entitlement: { type: string }
                  entries: { type: integer }
                  amountMinor: { type: integer }
            byBand:
              type: array
              items:
                type: object
                properties:
                  practice: { type: string }
                  entries: { type: integer }
                  amountMinor: { type: integer }

    LoggedMessage:
      type: object
      properties:
        messageLogId: { type: string }
        appointmentId: { type: string }
        kind: { type: string, example: APPOINTMENT_REMINDER }
        channel: { type: string, enum: [EMAIL, SMS] }
        recipient: { type: [string, "null"], description: The address or number it went to. }
        deliveryState: { type: string, enum: [SENT, DELIVERED, FAILED, CANCELLED] }
        feedback: { type: [string, "null"], enum: [BOUNCE, COMPLAINT, null] }
        failureReason: { type: [string, "null"] }
        settledAt: { type: string, format: date-time }
        reportedAt:
          type: [string, "null"]
          format: date-time
          description: When the provider last reported on it (FR-MSG-04).
        person:
          type: object
          description: The patient, and the number on file now, which is the one to phone.
          properties:
            name: { type: [string, "null"] }
            phoneE164: { type: [string, "null"] }
        visit:
          type: [object, "null"]
          properties:
            startAt: { type: [string, "null"], format: date-time }
            state: { type: [string, "null"] }
            patientProfileId: { type: [string, "null"] }

    DeliveryFigures:
      type: object
      properties:
        email:
          type: object
          properties:
            attempted: { type: integer }
            delivered: { type: integer }
            failed: { type: integer }
            bounced: { type: integer }
            complained: { type: integer }
            deliveryRate: { type: [number, "null"] }
            bounceRate: { type: [number, "null"] }
            complaintRate: { type: [number, "null"] }
        sms:
          type: object
          properties:
            attempted: { type: integer }
            delivered: { type: integer }
            failed: { type: integer }
            deliveryRate: { type: [number, "null"] }
            spendUsd:
              type: string
              description: What SNS reported the texts cost, to a hundredth of a cent.

    CancelledAppointment:
      allOf:
        - $ref: "#/components/schemas/Appointment"
        - type: object
          required: [outcome, entitlement]
          properties:
            outcome:
              type: string
              enum: [CANCELLED_IN_WINDOW, CANCELLED_LATE, CLINIC_CANCELLED]
              description: |
                Which side cancelled, and whether a patient cancellation fell
                inside the type's notice window.
            entitlement:
              type: string
              enum: [NONE, PARTIAL, FULL]
              description: |
                FULL inside the window or whenever the clinic cancelled,
                PARTIAL for a late patient cancellation. A record, not a
                payment.
            note: { type: string }

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine readable reason, for example conflict or forbidden.
        message:
          type: string
          description: One sentence, safe to show. Never names a record the caller cannot see.
        detail:
          type: object
          additionalProperties: true
          description: Present where it helps the caller act, for example the allowed states.
        requestId:
          type: string
          description: The invocation, for tracing a report from a clinic.

  responses:
    MovedAppointment:
      description: The appointment in its new state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Appointment" }
    WrongState:
      description: The lifecycle does not allow that move from the appointment's current state, or it changed meanwhile.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: The request is malformed, or fails a validation rule.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: invalid_request
            message: at least one role is required

    Unauthenticated:
      description: No usable token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: unauthenticated, message: the request carries no resolved caller }

    Forbidden:
      description: |
        The permission matrix or a guard rule refuses this action. The body
        names the permission and nothing about the record.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: forbidden
            message: that action is not permitted for this account
            detail: { permission: appointment.reschedule }

    NotFound:
      description: |
        No such record within the caller's scope. Returned for a record that
        exists but is out of scope as well, so a refusal cannot be used to
        discover it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: not_found, message: no such appointment }

    Conflict:
      description: |
        The state no longer allows the action, or a slot unit is taken. The
        detail carries the states the lifecycle does allow.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: conflict
            message: a appointment in PATIENT_CANCELLED cannot move to PATIENT_CANCELLED
            detail:
              from: PATIENT_CANCELLED
              requested: PATIENT_CANCELLED
              allowed: []
